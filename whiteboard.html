<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>GEM · 나의 칠판 교실</title><link rel="stylesheet" href="/whiteboard/classroom.css"></head>
<body>
 <header class="topbar"><a class="brand" href="https://gem-ai-class-hub.seoul0119.chatgpt.site/" aria-label="GEM home">GEM<span>LEARNING MISSION</span></a><div class="top-actions"><label class="sr-only" for="language">Language</label><select id="language"><option value="ko">한국어</option><option value="en">English</option><option value="fr">Français</option></select><a href="/science-board.html">고3 과학 시범</a><a href="/" data-label="logout">나가기</a></div></header>
 <main>
  <div class="intro"><div><p class="eyebrow" data-label="pilot">1대1 칠판 교실 · 시범</p><h1 id="lesson-title">10을 만들어 더하기</h1><p id="lesson-subtitle">20 이내 덧셈 · 나의 속도로 배우기</p></div><div class="teacher"><span class="teacher-mark" aria-hidden="true">G</span><div><strong id="teacher-name">Mei</strong><span id="student-name"></span></div></div></div>
  <div class="classroom-layout">
   <section class="lesson-column" aria-labelledby="lesson-title">
    <div class="board-shell"><div class="board-top"><span id="scene-label"></span><span id="scene-count">1 / 6</span></div><div class="board" id="board"><svg id="board-svg" viewBox="0 0 720 340" role="img" aria-label="7 + 5"></svg></div><div class="narration"><span class="small-label" id="speaker-name">Mei</span><p id="narration-text"></p></div><div class="progress-track"><div id="audio-progress"></div></div></div>
    <div id="scene-nav" class="scene-nav" aria-label="Lesson scenes"></div>
    <div class="transport"><button class="primary" id="play" data-label="start">설명 시작</button><button id="pause" data-label="pause">잠깐 멈추기</button><button id="replay" data-label="replay">이 장면 다시 듣기</button><label class="speed"><span data-label="speed">설명 속도</span><select id="speed"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option></select></label></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section id="practice-choice" class="practice-choice"><div><strong data-label="one">한 문제 풀기</strong><p data-label="optional">10문제를 풀지 않아도 수업을 이용할 수 있어요.</p></div><div class="practice-buttons"><button id="one" data-label="one">한 문제 풀기</button><button id="ten" data-label="ten">10문제 풀기 · 선택</button></div></section>
    <section id="practice-panel" class="practice-panel" hidden aria-labelledby="practice-heading"><div class="practice-heading"><h2 id="practice-heading"></h2><button id="back" class="text-button" data-label="back">설명으로 돌아가기</button></div><form id="answer-form"><label for="answer" data-label="answer">나의 답</label><div class="answer-row"><input id="answer" type="text" inputmode="numeric" autocomplete="off" maxlength="2" pattern="[0-9]{1,2}" required><button class="primary" type="submit" data-label="check">답 확인</button></div></form><p id="feedback" role="status" aria-live="polite"></p><div class="practice-buttons"><button id="show-solution" data-label="show">풀이 보기</button><button id="next" data-label="next" hidden>다음 문제</button></div></section>
   </section>
   <aside class="question-panel" aria-labelledby="question-heading"><p class="eyebrow" data-label="ask">질문하기</p><h2 id="question-heading" data-label="questionLabel">질문과 답변</h2><p class="question-help" data-label="noQuestion">설명 중에도 언제든 질문할 수 있어요.</p><div id="conversation" class="conversation" role="log" aria-live="polite"></div><form id="question-form"><label class="sr-only" for="question" data-label="ask">질문하기</label><textarea id="question" rows="3" maxlength="1200" placeholder="궁금한 점을 쓰세요. 쓰기 시작하면 설명이 멈춰요."></textarea><div class="question-buttons"><button id="mic" type="button" data-label="mic">마이크로 질문</button><button id="send" class="primary" type="submit" data-label="submitQuestion">질문 보내기</button></div></form><p class="microphone-note" data-label="record">마이크는 버튼을 누른 동안만 사용해요.</p><button id="listen-answer" class="text-button" data-label="listen" hidden>답변 다시 듣기</button></aside>
  </div>
  <footer><span data-label="disclosure">AI 선생님의 음성과 답변입니다.</span><span data-label="saved">이 기기에 이어할 위치를 저장해요.</span><button id="restart" class="text-button" data-label="restart">처음부터</button></footer>
 </main><script type="module" src="/whiteboard/classroom.js"></script>
</body></html>

name: All ten mission questions
on:
  push:
    branches:
      - preview/mission-all-questions-20260925
permissions:
  contents: read
concurrency:
  group: mission-all-questions-20260925
  cancel-in-progress: true
jobs:
  all-ten:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Preserved regression suites and all-question traversal
        run: npm run vercel-build

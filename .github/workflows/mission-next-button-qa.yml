name: Next button focused QA
on:
  push:
    branches:
      - test/mission-next-20260925
permissions:
  contents: read
concurrency:
  group: next-button-test-only
  cancel-in-progress: true
jobs:
  next-button-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Identify the exact unchanged runtime under test
        run: git hash-object mission/programme/core.mjs
      - run: node mission/programme/tests.mjs
      - run: node mission/programme/next-button-tests.mjs
      - run: timeout --kill-after=10s 120s node mission/programme/run-next-browser-tests.mjs

<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEM 교실 연결</title><body><main><h1>학생 기록을 교실에 연결하고 있습니다.</h1><p id="status" role="status"></p><button onclick="location.reload()">다시 연결</button><a href="/">학생 입장</a></main><script type="module">
import {RECORD_CLASSROOMS} from '/lib/classroom-catalog.js';
const key=new URLSearchParams(location.search).get('classroom'),origin=RECORD_CLASSROOMS[key];
try{if(!origin)throw Error('교실을 다시 선택해 주세요.');const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'classroom-pass',classroom:key})});const d=await r.json();if(r.status===401){location.replace('/?recordClassroom='+encodeURIComponent(key));}else{if(!r.ok||!d.ticket)throw Error(d.error||'연결을 다시 시도해 주세요.');const f=document.createElement('form');f.method='POST';f.action=origin+'/api/gem-records/entry';const i=document.createElement('input');i.type='hidden';i.name='ticket';i.value=d.ticket;f.append(i);const dest=document.createElement('input');dest.type='hidden';dest.name='destination';dest.value=new URLSearchParams(location.search).get('destination')||'/';f.append(dest);document.body.append(f);f.submit();}}catch(e){document.getElementById('status').textContent=e.message;}
</script></body></html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEM AI Learning Mission Class</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --navy: #07162d;
      --blue: #1e67c6;
      --blue-dark: #144f9d;
      --gold: #e7c46a;
      --ink: #172033;
      --muted: #657186;
      --paper: #ffffff;
      --bg: #eef3fa;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    body.auth-pending header, body.auth-pending main { visibility: hidden; }
    header {
      padding: 24px 18px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, var(--navy), #173d70);
    }
    .brand {
      margin-bottom: 7px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    h1 { margin: 0; font-size: clamp(23px, 5vw, 32px); }
    header p { margin: 9px 0 0; color: #dce6f5; }
    main {
      width: min(760px, 94%);
      margin: 20px auto 36px;
    }
    .status {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 12px 16px;
      border: 1px solid #d6dfeb;
      border-radius: 14px;
      background: var(--paper);
      color: var(--muted);
      font-size: 14px;
    }
    .status strong { color: #173d70; }
    .chat {
      min-height: 430px;
      max-height: 62vh;
      overflow-y: auto;
      padding: 18px;
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 8px 24px rgba(7, 22, 45, .10);
    }
    .message {
      width: fit-content;
      max-width: 88%;
      margin: 0 0 14px;
      padding: 13px 15px;
      border-radius: 16px;
      white-space: pre-wrap;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }
    .assistant {
      margin-right: auto;
      border: 1px solid #d8e3f2;
      border-bottom-left-radius: 5px;
      background: #f4f8fe;
    }
    .user {
      margin-left: auto;
      border-bottom-right-radius: 5px;
      background: var(--blue);
      color: white;
    }
    .typing { color: var(--muted); font-style: italic; }
    form {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    input {
      min-width: 0;
      flex: 1;
      padding: 15px 16px;
      border: 2px solid #cbd7e7;
      border-radius: 13px;
      font-size: 17px;
      outline: none;
    }
    input:focus { border-color: var(--blue); }
    button {
      border: 0;
      border-radius: 13px;
      background: var(--blue);
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--blue-dark); }
    button:disabled { cursor: wait; opacity: .65; }
    .send { min-width: 88px; padding: 0 18px; }
    .mic {
      min-width: 104px;
      padding: 0 15px;
      background: #16805d;
    }
    .mic:hover { background: #106649; }
    .mic.listening { background: #c43d4d; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 10px;
    }
    .volume-control {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(360px, 100%);
      margin-top: 10px;
      padding: 10px 13px;
      border: 1px solid #cbd7e7;
      border-radius: 13px;
      background: white;
      color: #173d70;
      font-size: 14px;
      font-weight: 700;
    }
    .volume-control input { min-width: 0; flex: 1; padding: 0; }
    .volume-value { min-width: 40px; text-align: right; }
    .secondary {
      padding: 10px 13px;
      border: 1px solid #cbd7e7;
      background: white;
      color: #173d70;
      font-size: 14px;
    }
    .secondary:hover { background: #f4f8fe; }
    .notice {
      margin-top: 16px;
      padding: 13px 15px;
      border: 1px solid #ecd38c;
      border-radius: 13px;
      background: #fff8e5;
      color: #594a22;
      font-size: 13px;
      line-height: 1.6;
    }
    .math-tools {
      display: none;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #cbd7e7;
      border-radius: 14px;
      background: white;
    }
    .math-tools.open { display: block; }
    .tool-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .math-key {
      min-width: 62px;
      padding: 9px 11px;
      border: 1px solid #b9c9de;
      background: #f4f8fe;
      color: #173d70;
      font-size: 15px;
    }
    .math-help { margin: 10px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .large-view {
      display: block;
      margin-top: 9px;
      padding: 7px 10px;
      border: 1px solid #afc4df;
      background: white;
      color: #173d70;
      font-size: 13px;
    }
    .visual-card {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #bfd0e5;
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
    }
    .visual-title { margin: 0 0 9px; color: #173d70; font-weight: 700; }
    .visual-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .visual-table th, .visual-table td { padding: 8px; border: 1px solid #cbd7e7; text-align: center; }
    .visual-table th { background: #eaf2fc; color: #173d70; }
    .visual-plain { margin: 0; white-space: pre-wrap; font: inherit; line-height: 1.7; }
    .visual-bars { display: grid; gap: 8px; }
    .visual-bar-row { display: grid; grid-template-columns: minmax(62px, auto) 1fr auto; gap: 8px; align-items: center; }
    .visual-bar-track { height: 18px; overflow: hidden; border-radius: 9px; background: #e6edf7; }
    .visual-bar-fill { height: 100%; border-radius: 9px; background: linear-gradient(90deg, #1e67c6, #65a7ed); }
    .toeic-scene-card {
      width: 100%;
      margin-top: 12px;
      overflow: hidden;
      border: 1px solid #b8cce5;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 5px 16px rgba(15, 52, 96, .09);
    }
    .toeic-scene-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0;
      padding: 10px 13px;
      color: #173d70;
      background: #edf5ff;
      font-size: 14px;
      font-weight: 700;
    }
    .toeic-scene-heading span {
      color: #617189;
      font-size: 12px;
      font-weight: 400;
    }
    .toeic-scene-svg {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #e9f3ff;
    }
    .toeic-scene-note {
      margin: 0;
      padding: 9px 13px 11px;
      color: #59677c;
      font-size: 12px;
      line-height: 1.5;
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(7, 22, 45, .68);
    }
    .modal.open { display: flex; }
    .modal-card {
      width: min(900px, 98vw);
      max-height: 88vh;
      overflow: auto;
      padding: 22px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 14px 45px rgba(0, 0, 0, .3);
    }
    .modal-text { white-space: pre-wrap; font-size: clamp(17px, 2.5vw, 24px); line-height: 1.8; }
    .modal-text .visual-table { font-size: inherit; }
    .modal-text .toeic-scene-card { margin-top: 46px; }
    .modal-close { float: right; padding: 9px 13px; }
    .avatar-stage {
      position: relative;
      display: none;
      min-height: 330px;
      margin-bottom: 12px;
      overflow: hidden;
      border: 1px solid #c5d5e8;
      border-radius: 18px;
      background: radial-gradient(circle at 50% 34%, #f9fcff 0, #e8f2ff 58%, #d7e6f7 100%);
      box-shadow: 0 8px 24px rgba(7, 22, 45, .09);
    }
    .avatar-stage.open { display: block; }
    .avatar-stage.hidden-avatar { min-height: 0; height: 58px; }
    .avatar-stage.hidden-avatar canvas,
    .avatar-stage.hidden-avatar .avatar-loading { display: none; }
    #avatar-canvas { display: block; width: 100%; height: 330px; touch-action: none; }
    .avatar-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #274d79;
      font-weight: 700;
      text-align: center;
      pointer-events: none;
    }
    .avatar-controls {
      position: absolute;
      right: 10px;
      bottom: 10px;
      display: flex;
      gap: 8px;
    }
    .avatar-toggle {
      padding: 9px 12px;
      border: 1px solid #aec2db;
      background: rgba(255,255,255,.94);
      color: #173d70;
      font-size: 13px;
    }
    .avatar-error { color:#9f2d2d; }
    @media (max-width: 520px) {
      main { width: 96%; margin-top: 10px; }
      .chat { min-height: 390px; padding: 13px; }
      .message { max-width: 94%; }
      .status { flex-direction: column; gap: 4px; }
      .send { min-width: 72px; padding: 0 12px; }
      form { flex-wrap: wrap; }
      input { flex-basis: calc(100% - 84px); }
      .mic { order: 3; width: 100%; min-height: 48px; }
      .toeic-scene-heading { align-items: flex-start; flex-direction: column; }
      .avatar-stage { min-height: 320px; }
      #avatar-canvas { height: 320px; }
      .avatar-controls { right: 8px; bottom: 8px; }
      .avatar-toggle { min-height: 42px; padding: 9px 11px; font-size: 12px; }

      /* The avatar lesson becomes a single-screen classroom on phones. */
      html:has(body.avatar-course),
      body.avatar-course {
        width: 100%;
        max-width: 100%;
        height: 100dvh;
        overflow: hidden;
      }
      body.avatar-course header,
      body.avatar-course .status,
      body.avatar-course .notice,
      body.avatar-course .volume-control { display: none; }
      body.avatar-course main {
        display: grid;
        grid-template-rows: 148px minmax(0, 1fr) auto auto;
        gap: 7px;
        width: 100%;
        height: 100dvh;
        margin: 0;
        padding: 6px;
        overflow: hidden;
      }
      body.avatar-course main > *,
      body.avatar-course form > *,
      body.avatar-course .actions > * {
        min-width: 0;
        max-width: 100%;
      }
      body.avatar-course .avatar-stage {
        position: relative;
        min-height: 148px;
        height: 148px;
        margin: 0;
        border-radius: 14px;
      }
      body.avatar-course.avatar-hidden main {
        grid-template-rows: 52px minmax(0, 1fr) auto auto;
      }
      body.avatar-course .avatar-stage.hidden-avatar {
        min-height: 52px;
        height: 52px;
      }
      body.avatar-course #avatar-canvas { height: 148px; }
      body.avatar-course .avatar-loading {
        align-items: start;
        padding: 10px 8px;
        font-size: 13px;
      }
      body.avatar-course .avatar-controls {
        right: 6px;
        bottom: 6px;
        left: 6px;
        justify-content: flex-end;
        min-width: 0;
      }
      body.avatar-course .avatar-toggle {
        min-height: 34px;
        padding: 6px 8px;
        font-size: 11px;
      }
      body.avatar-course .chat {
        min-height: 0;
        max-height: none;
        height: 100%;
        padding: 9px;
        border-radius: 14px;
        overscroll-behavior: contain;
      }
      body.avatar-course.mobile-lesson-focus .chat .message:not(.mobile-current):not(.mobile-previous):not(.typing) {
        display: none;
      }
      body.avatar-course .message {
        width: 100%;
        max-width: 100%;
        margin-bottom: 8px;
        padding: 11px 12px;
        font-size: 16px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      body.avatar-course form {
        width: 100%;
        flex-wrap: nowrap;
        gap: 7px;
        margin: 0;
        overflow: hidden;
      }
      body.avatar-course form input {
        width: 0;
        flex: 1 1 0;
        flex-basis: 0;
        padding: 11px 10px;
        font-size: 16px;
      }
      body.avatar-course .mic {
        order: initial;
        width: auto;
        min-width: 0;
        max-width: 44%;
        min-height: 44px;
        padding: 7px 10px;
        font-size: 13px;
      }
      body.avatar-course .send { flex: 0 0 58px; min-width: 0; padding: 0 7px; font-size: 14px; }
      body.avatar-course .actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        margin: 0;
        overflow: hidden;
      }
      body.avatar-course .actions .secondary {
        width: 100%;
        padding: 8px 6px;
        font-size: 11px;
        line-height: 1.2;
        white-space: normal;
      }
      body.avatar-course.voice-conversation form input,
      body.avatar-course.voice-conversation form .send,
      body.avatar-course.voice-conversation .actions { display: none; }
      body.avatar-course.voice-conversation form .mic {
        display: block;
        width: 100%;
        min-height: 46px;
        font-size: 15px;
      }
      vercel-live-feedback,
      vercel-toolbar,
      #vercel-toolbar,
      [data-vercel-toolbar] { display: none !important; }
    }
  </style>
</head>
<body class="auth-pending">
  <header>
    <div class="brand">GEM AI LEARNING MISSION CLASS</div>
    <h1 id="course-title">GEM AI 수업</h1>
    <p>AI가 가르치고, 사람 교사가 책임집니다.</p>
  </header>

  <main>
    <section class="status" aria-label="수업 상태">
      <span><strong>과목</strong> <span id="course-subject">수업</span></span>
      <span><strong>학년</strong> <span id="course-grade">중학교 1학년</span></span>
      <span id="connection"><strong>상태</strong> 수업 준비</span>
    </section>

    <section id="avatar-stage" class="avatar-stage" aria-label="GEM AI avatar teacher">
      <canvas id="avatar-canvas"></canvas>
      <div id="avatar-loading" class="avatar-loading">Preparing your avatar teacher…</div>
      <div class="avatar-controls">
        <button id="avatar-start" class="avatar-toggle" type="button">Start Lesson</button>
        <button id="avatar-toggle" class="avatar-toggle" type="button">Hide avatar</button>
      </div>
    </section>

    <section id="chat" class="chat" aria-live="polite" aria-label="수업 대화">
      <div id="initial-message" class="message assistant">수업을 준비하고 있습니다.</div>
    </section>

    <form id="chat-form">
      <input id="message" type="text" placeholder="시작 또는 답을 입력하세요" autocomplete="off" maxlength="3000" required>
      <button id="mic" class="mic" type="button">🎤 말하기</button>
      <button id="send" class="send" type="submit">보내기</button>
    </form>

    <div class="actions">
      <button id="speak" class="secondary" type="button">🔊 다시 듣기</button>
      <button id="auto-speak" class="secondary" type="button" hidden>🔊 음성 계속</button>
      <button id="math-tools-toggle" class="secondary" type="button" hidden>⌨ 수학 입력 도구</button>
      <button id="restart" class="secondary" type="button">↻ 새 수업</button>
      <button id="end-lesson" class="secondary" type="button">■ 수업 마치기</button>
      <button id="back-entrance" class="secondary" type="button">← 입구로 돌아가기</button>
    </div>
    <label class="volume-control" for="teacher-volume">
      <span id="teacher-volume-label">🔉 선생님 음량</span>
      <input id="teacher-volume" type="range" min="5" max="100" step="5" value="45">
      <span id="teacher-volume-value" class="volume-value">45%</span>
    </label>

    <section id="math-tools" class="math-tools" aria-label="수학 입력 도구">
      <div class="tool-grid">
        <button class="math-key" type="button" data-insert="^2">x²</button>
        <button class="math-key" type="button" data-insert="^3">x³</button>
        <button class="math-key" type="button" data-insert="sqrt()">√</button>
        <button class="math-key" type="button" data-insert="/">분수 /</button>
        <button class="math-key" type="button" data-insert="<=">≤</button>
        <button class="math-key" type="button" data-insert=">=">≥</button>
        <button class="math-key" type="button" data-insert="!=">≠</button>
        <button class="math-key" type="button" data-insert="pi">π</button>
        <button class="math-key" type="button" data-insert="()">( )</button>
        <button class="math-key" type="button" data-insert="|x|">|x|</button>
        <button class="math-key" type="button" data-insert=" 합집합 ">∪</button>
        <button class="math-key" type="button" data-insert=" 교집합 ">∩</button>
      </div>
      <p id="math-help" class="math-help">예: x²는 x^2 · √2는 sqrt(2) · 2/3 · x≤3은 x&lt;=3 · 집합은 {1,2,3}처럼 입력합니다.</p>
    </section>

    <div id="privacy-notice" class="notice">
      이 수업은 보호자 또는 교사의 지도 아래 이용합니다. 이름·학교·주소·전화번호 등 개인정보를 입력하지 마세요.
    </div>
  </main>

  <div id="large-modal" class="modal" role="dialog" aria-modal="true" aria-label="도표 크게 보기">
    <div class="modal-card">
      <button id="modal-close" class="modal-close" type="button">닫기</button>
      <div id="modal-text" class="modal-text"></div>
    </div>
  </div>

        error.status = response.status;

      }
      return data;

    function cleanForDisplay(text) {
      let output = String(text || "")
        .replace(/```[\s\S]*?```/g, (block) => block.replace(/```\w*|```/g, ""))
        // Remove Markdown emphasis without deleting TOEFL word blanks such as
        // recycl____. The old generic `__` removal erased every visible blank.
        .replace(/__([^_\n]+)__/g, "$1")
        .replace(/\*\*|`|#+\s?/g, "")
        // Four underscores are enough for validation, but eight are easier to
        // see on classroom TVs and small phone screens.
        .replace(/_{4,}/g, "________")
        .replace(/^\s*[-*]\s+/gm, "• ")
        .trim();
      if (COURSE.avatar) {
        output = output
          .replace(/^답(?:\s*\d+)?\s*:/gm, "Answer:")
          .replace(/^정답(?:\s*\d+)?\s*:/gm, "Answer:");
      }
      return output;
    }

    function ensureVisibleAnswerSlot(text) {
      let output = String(text || "").trimEnd();
      const needsEnglishAnswerSlot = COURSE_ID === "toefl"
        || COURSE_ID === "toeic"
        || COURSE_ID.endsWith("-english");
      if (!needsEnglishAnswerSlot) return output;
      if (/(?:오늘의|이번)\s+.+수업을\s+마쳤|수업\s+종료|학습을\s+마쳤/.test(output)) return output;

      const awaitsAnswer = /(?:^|\s)\d+\s*\/\s*10(?:\s|—|-)/m.test(output)
        || /Complete\s+the\s+Words/i.test(output)
        || /(?:다시|한\s*번\s*더).{0,20}(?:답해|말해|입력|적어|써)/s.test(output);
      if (!awaitsAnswer) return output;

      output = output.replace(
        /^답\s*:\s*(?!\([ _\u3000]{3,}\)\s*$).+$/gm,
        "답: (________)"
      );
      if (/답(?:\s*\d+)?\s*:\s*\([ _\u3000]{3,}\)/.test(output)) return output;
      return `${output}\n\n답: (________)`;
    }

    function keepOnlyFirstAvatarQuestion(text) {
      const output = String(text || "").trimEnd();
      const activityStart = output.search(/(?:Activity|Activité)\s+1\s*\/\s*10\b/i);
      if (activityStart < 0) return output;

      const answerSlot = /(?:Answer|Réponse)(?:\s*1)?\s*:\s*\([ _\u3000]{3,}\)/i;
      const match = answerSlot.exec(output.slice(activityStart));
      if (!match) return output;

      const answerEnd = activityStart + match.index + match[0].length;
      return output.slice(0, answerEnd).trimEnd();
    }

    function cleanAvatarReply(text, userText = "") {
      let output = String(text || "");
      const isHint = /\b(?:hint|help|i\s+don'?t\s+know|i\s+don'?t\s+understand|indice|aide|je\s+ne\s+sais\s+pas|je\s+ne\s+comprends\s+pas)\b/i.test(String(userText || ""));
      if (isHint) {
        output = output.replace(
          /^\s*(?:Answer|Réponse|답|정답)(?:\s*\d+)?\s*:\s*\([ _\u3000]{3,}\)\s*$/gim,
          ""
        );
      }

      const lines = output.split(/\r?\n/);
      output = lines.filter((line, index) => {
        if (!/^\s*[A-Da-d](?:[).:：])?\s*$/.test(line)) return true;
        const nearby = lines.slice(Math.max(0, index - 3), index + 4).join("\n");
        return /^\s*[A-Da-d]\s*[).:：]\s*\S+/m.test(nearby);
      }).join("\n");

      return output.replace(/\n{3,}/g, "\n\n").trim();
    }

    function cleanMathForSpeech(text) {
      const output = cleanForDisplay(text)
        .replace(/\[도표 시작\]|\[도표 끝\]/g, "")
      if (COURSE.language === "fr") {
        return output
          .replace(/sqrt\(([^)]+)\)/gi, "la racine carrée de $1")
          .replace(/([A-Za-z0-9])\^2/g, "$1 au carré")
          .replace(/([A-Za-z0-9])\^3/g, "$1 au cube")
          .replace(/≤|<=/g, " est inférieur ou égal à ")
          .replace(/≥|>=/g, " est supérieur ou égal à ")
          .replace(/≠|!=/g, " n'est pas égal à ")
          .replace(/×|\*/g, " fois ")
          .replace(/÷/g, " divisé par ");
      }
      if (COURSE.language === "en" || COURSE.avatar) {
        return output
          .replace(/sqrt\(([^)]+)\)/gi, "the square root of $1")
          .replace(/([A-Za-z0-9])\^2/g, "$1 squared")
          .replace(/([A-Za-z0-9])\^3/g, "$1 cubed")
          .replace(/≤|<=/g, " is less than or equal to ")
          .replace(/≥|>=/g, " is greater than or equal to ")
          .replace(/≠|!=/g, " is not equal to ")
          .replace(/×|\*/g, " times ")
          .replace(/÷/g, " divided by ")
          .replace(/π/g, " pi ")
          .replace(/∪/g, " union ")
          .replace(/∩/g, " intersection ");
      }
      return output
        .replace(/sqrt\(([^)]+)\)/gi, "$1의 제곱근")
        .replace(/([A-Za-z0-9가-힣)])\^2/g, "$1의 제곱")
        .replace(/([A-Za-z0-9가-힣)])\^3/g, "$1의 세제곱")
        .replace(/≤|<=/g, " 이하 ")
        .replace(/≥|>=/g, " 이상 ")
        .replace(/≠|!=/g, " 같지 않음 ")
        .replace(/×|\*/g, " 곱하기 ")
        .replace(/÷/g, " 나누기 ")
        .replace(/π/g, " 파이 ")
        .replace(/∪/g, " 합집합 ")
        .replace(/∩/g, " 교집합 ");
    }

    function cleanLessonForSpeech(text) {
      return cleanForDisplay(text)
        .replace(/^\s*(?:활동|문제|Activity|Activité)\s*\d+\s*\/\s*10[^\n]*$/gim, "")
        .replace(/^\s*(?:답|Answer|Réponse)(?:\s*\d+)?\s*:\s*\([ _\u3000]{3,}\)\s*$/gim, "")
        .replace(/_{4,}/g, COURSE.language === "fr" ? " blanc " : (COURSE.avatar ? " blank " : " 빈칸 "))
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }

    function getVoice(language) {
      const voices = window.speechSynthesis.getVoices();
      const prefix = language.toLowerCase().split("-")[0];
      return voices.find((voice) => voice.lang.toLowerCase() === language.toLowerCase())
        || voices.find((voice) => voice.lang.toLowerCase().startsWith(prefix))
        || null;
    }

    function browserSpeak(text) {
      if (!("speechSynthesis" in window)) return;
      const clean = cleanLessonForSpeech(text);
      if (!clean) return;
      window.speechSynthesis.cancel();

      const parts = clean.split(/\n+/).map((part) => part.trim()).filter(Boolean);
      parts.forEach((part) => {
        const latinCount = (part.match(/[A-Za-z]/g) || []).length;
        const koreanCount = (part.match(/[가-힣]/g) || []).length;
        const language = COURSE.language === "fr" ? "fr-FR" : (latinCount > koreanCount ? "en-US" : "ko-KR");
        const utterance = new SpeechSynthesisUtterance(part);
        utterance.lang = language;
        utterance.voice = getVoice(language);
        utterance.rate = language === "ko-KR" ? 0.9 : 0.78;
        utterance.pitch = 1;
        utterance.volume = teacherVolume;
        window.speechSynthesis.speak(utterance);
      });
    }

    async function speakText(text) {
      const withoutRawVisual = String(text || "")
        .replace(/\[도표 시작\][\s\S]*?\[도표 끝\]/g, "")
        .replace(/\[TOEIC 그림 시작\][\s\S]*?\[TOEIC 그림 끝\]/g, "");
      const clean = IS_MATH ? cleanMathForSpeech(withoutRawVisual) : cleanLessonForSpeech(withoutRawVisual);
      if (!clean) return;
      if (currentAudio) currentAudio.pause();
      window.speechSynthesis?.cancel();
      window.dispatchEvent(new CustomEvent("gem-avatar-speaking", { detail: { speaking: true } }));

      try {
        const response = await fetch("/api/speech", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: clean, courseId: COURSE_ID })
        });
        const data = await readJsonResponse(response, COURSE.avatar
          ? AVATAR_TEXT.voiceUnavailable
          : "AI 음성 서버가 잠시 응답하지 않습니다.");
        if (!response.ok || !data.audio) throw new Error(data.error || (COURSE.avatar
          ? AVATAR_TEXT.voiceUnavailable
          : "음성 생성 실패"));
        currentAudio = new Audio(`data:${data.mimeType};base64,${data.audio}`);
        currentAudio.volume = teacherVolume;
        await currentAudio.play();
        await new Promise((resolve) => {
          currentSpeechResolve = resolve;
          currentAudio.addEventListener("ended", resolve, { once: true });
          currentAudio.addEventListener("error", resolve, { once: true });
        });
      } catch (error) {
        console.warn("Natural voice fallback", error);
        browserSpeak(clean);
      } finally {
        currentSpeechResolve = null;
        window.dispatchEvent(new CustomEvent("gem-avatar-speaking", { detail: { speaking: false } }));
      }
    }

    function extractVisual(text) {
      const output = String(text || "");
      const visualMatch = output.match(/\[도표 시작\]([\s\S]*?)\[도표 끝\]/);
      const sceneMatch = output.match(/\[TOEIC 그림 시작\]([\s\S]*?)\[TOEIC 그림 끝\]/);
      const withoutVisualBlock = (value) => String(value || "")
        .replace(/\[도표 시작\][\s\S]*?\[도표 끝\]/g, "")
        .trim();
      const sceneBefore = sceneMatch ? withoutVisualBlock(output.slice(0, sceneMatch.index)) : "";
      const sceneAfter = sceneMatch
        ? withoutVisualBlock(output.slice((sceneMatch.index || 0) + sceneMatch[0].length))
        : "";
      return {
        body: output
          .replace(/\[도표 시작\][\s\S]*?\[도표 끝\]/g, "")
          .replace(/\[TOEIC 그림 시작\][\s\S]*?\[TOEIC 그림 끝\]/g, "")
          .trim(),
        visual: visualMatch ? visualMatch[1].trim() : "",
        toeicScene: sceneMatch ? sceneMatch[1].trim() : "",
        sceneBefore,
        sceneAfter
      };
    }

    const SVG_NS = "http://www.w3.org/2000/svg";

    function addSvg(parent, name, attributes = {}, textContent = "") {
      const node = document.createElementNS(SVG_NS, name);
      Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, String(value)));
      if (textContent) node.textContent = textContent;
      parent.appendChild(node);
      return node;
    }

    function parseToeicScene(content) {
      const values = {};
      String(content || "").split("\n").forEach((line) => {
        const match = line.match(/^([^:]+):\s*(.+)$/);
        if (match) values[match[1].trim()] = match[2].trim();
      });
      return {
        place: (values["장소"] || "office").toLowerCase(),
        people: Number(values["인물"] || 1),
        action: (values["행동"] || "standing").toLowerCase(),
        background: values["배경"] || ""
      };
    }

    function buildToeicSceneCard(content) {
      const scene = parseToeicScene(content);
      const placeLabels = { warehouse: "창고", office: "사무실", "meeting-room": "회의실", cafe: "카페", restaurant: "식당", store: "상점", station: "기차역", airport: "공항", street: "거리", park: "공원", garden: "정원", library: "도서관", classroom: "교실", hotel: "호텔" };
      const actionLabels = { "labeling-box": "상자에 라벨을 붙이는", "carrying-box": "상자를 나르는", "typing-computer": "컴퓨터로 작업하는", "reading-document": "문서를 읽는", "writing-document": "문서를 작성하는", talking: "대화하는", meeting: "회의하는", "serving-drink": "음료를 건네는", "loading-boxes": "상자를 싣는", cleaning: "청소하는", walking: "걷는", sitting: "앉아 있는", standing: "서 있는" };
      const placeLabel = placeLabels[scene.place] || "실내";
      const actionLabel = actionLabels[scene.action] || "활동하는";
      const card = document.createElement("section");
      card.className = "toeic-scene-card";
      const heading = document.createElement("p");
      heading.className = "toeic-scene-heading";
      heading.append("TOEIC Part 1 사진");
      const instruction = document.createElement("span");
      instruction.textContent = "그림과 가장 잘 맞는 문장을 고르세요.";
      heading.appendChild(instruction);
      card.appendChild(heading);
      const svg = addSvg(card, "svg", { viewBox: "0 0 720 405", class: "toeic-scene-svg", role: "img", "aria-label": `${placeLabel}에서 ${actionLabel} 사람을 나타낸 그림`, preserveAspectRatio: "xMidYMid meet" });
      drawSceneBackground(svg, scene.place);
      drawToeicAction(svg, scene.action, scene.people);
      const note = document.createElement("p");
      note.className = "toeic-scene-note";
      note.textContent = "장면의 사람, 행동, 물건과 위치를 차례로 살펴보세요.";
      card.appendChild(note);
      return card;
    }

    function buildVisualCard(content) {
      const card = document.createElement("section");
      card.className = "visual-card";
      const lines = content.split("\n").map((line) => line.trim()).filter(Boolean);
      const kind = (lines.find((line) => line.startsWith("종류:")) || "").slice(3).trim();
      const titleText = (lines.find((line) => line.startsWith("제목:")) || "").slice(3).trim() || "학습 시각 자료";
      const title = document.createElement("p");
      title.className = "visual-title";
      title.textContent = titleText;
      card.appendChild(title);

      const headerLine = lines.find((line) => line.startsWith("열:"));
      const rowLines = lines.filter((line) => line.startsWith("행:"));
      if (headerLine && rowLines.length) {
        const headers = headerLine.slice(2).split("|").map((cell) => cell.trim());
        const rows = rowLines.map((line) => line.slice(2).split("|").map((cell) => cell.trim()));
        const table = document.createElement("table");
        table.className = "visual-table";
        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        headers.forEach((header) => { const th = document.createElement("th"); th.textContent = header; headRow.appendChild(th); });
        thead.appendChild(headRow);
        table.appendChild(thead);
        const tbody = document.createElement("tbody");
        rows.forEach((row) => { const tr = document.createElement("tr"); row.forEach((cell) => { const td = document.createElement("td"); td.textContent = cell; tr.appendChild(td); }); tbody.appendChild(tr); });
        table.appendChild(tbody);
        card.appendChild(table);

        if (/그래프/.test(kind)) {
          const numericRows = rows.map((row) => ({ label: row[0], value: Number(String(row[1] || "").replace(/[^0-9.-]/g, "")) })).filter((row) => Number.isFinite(row.value));
          const max = Math.max(1, ...numericRows.map((row) => Math.abs(row.value)));
          const bars = document.createElement("div");
          bars.className = "visual-bars";
          numericRows.forEach((row) => {
            const line = document.createElement("div"); line.className = "visual-bar-row";
            const label = document.createElement("span"); label.textContent = row.label;
            const track = document.createElement("div"); track.className = "visual-bar-track";
            const fill = document.createElement("div"); fill.className = "visual-bar-fill"; fill.style.width = `${Math.max(2, Math.abs(row.value) / max * 100)}%`;
            const value = document.createElement("span"); value.textContent = String(row.value);
            track.appendChild(fill); line.append(label, track, value); bars.appendChild(line);
          });
          card.appendChild(bars);
        }
      } else {
        const plain = document.createElement("pre");
        plain.className = "visual-plain";
        plain.textContent = lines.filter((line) => !line.startsWith("종류:") && !line.startsWith("제목:")).join("\n");
        card.appendChild(plain);
      }
      return card;
    }

    function addMessage(role, text, extraClass = "") {
      const element = document.createElement("div");
      element.className = `message ${role} ${extraClass}`.trim();
      if (COURSE.avatar && role === "assistant" && extraClass !== "typing") {
        chat.querySelectorAll(".mobile-previous").forEach((message) => message.classList.remove("mobile-previous"));
        chat.querySelectorAll(".mobile-current").forEach((message) => {
          message.classList.remove("mobile-current");
          message.classList.add("mobile-previous");
        });
        element.classList.add("mobile-current");
        document.body.classList.add("mobile-lesson-focus");
      }
      const parts = extractVisual(text);
      const hasToeicScene = Boolean(parts.toeicScene);
      if (role === "assistant" && hasToeicScene) {
        if (parts.sceneBefore) element.appendChild(document.createTextNode(`${parts.sceneBefore}\n`));
        element.appendChild(buildToeicSceneCard(parts.toeicScene));
        const sceneExpand = document.createElement("button");
        sceneExpand.type = "button";
        sceneExpand.className = "large-view";
        sceneExpand.textContent = "🖼 그림 크게 보기";
        sceneExpand.addEventListener("click", () => {
          modalText.replaceChildren(buildToeicSceneCard(parts.toeicScene));
          largeModal.classList.add("open");
        });
        element.appendChild(sceneExpand);
        if (parts.sceneAfter) element.appendChild(document.createTextNode(`\n${parts.sceneAfter}`));
      } else {
        element.textContent = parts.body;
      }
      const hasVisual = Boolean(parts.visual);
      if (role === "assistant" && IS_VISUAL_LESSON && hasVisual) {
        element.appendChild(buildVisualCard(parts.visual));
        const expand = document.createElement("button");
        expand.type = "button";
        expand.className = "large-view";
        expand.textContent = IS_SCIENCE
          ? "🔍 실험·자료 크게 보기"
          : (IS_SOCIAL || IS_HISTORY)
            ? "🔍 자료·문제 크게 보기"
            : "🔍 도표·문제 크게 보기";
        expand.addEventListener("click", () => {
          modalText.replaceChildren(buildVisualCard(parts.visual));
          largeModal.classList.add("open");
        });
        element.appendChild(expand);
      }
      chat.appendChild(element);
      chat.scrollTop = chat.scrollHeight;
      if (isMobileAvatarLesson()) requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
      return element;
    }

    function setLoading(loading) {
      input.disabled = loading || lessonManuallyEnded;
      sendButton.disabled = loading || lessonManuallyEnded;
      micButton.disabled = loading || lessonManuallyEnded;
      if (lessonManuallyEnded) {
        connection.innerHTML = COURSE.avatar
          ? `<strong>${AVATAR_TEXT.status}</strong> ${AVATAR_TEXT.ended}`
          : "<strong>상태</strong> 수업 종료";
        return;
      }
      connection.innerHTML = COURSE.avatar
        ? `<strong>${AVATAR_TEXT.status}</strong> ${loading ? AVATAR_TEXT.preparing : AVATAR_TEXT.inProgress}`
        : loading
          ? "<strong>상태</strong> AI 선생님 응답 중"
          : "<strong>상태</strong> 수업 진행 중";
    }

    function rememberGeneratedProblem(text) {
      if (!IS_GENERATIVE_LESSON) return;
      const clean = cleanForDisplay(text);
      const match = clean.match(/(?:(?:문제|활동)|(?:problem|activity))\s*\d+\s*\/\s*10[\s\S]*/i);
      if (!match) return;
      const problem = match[0].slice(0, 700).trim();
      if (!problem || courseHistory.includes(problem)) return;
      courseHistory.push(problem);
      courseHistory = courseHistory.slice(-60);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(courseHistory));
    }

    async function sendMessage(text, inputMode = "text") {
      if (lessonManuallyEnded) return;
      if (!await sessionReady) return;
      addMessage("user", text);
      messages.push({ role: "user", content: text });
      setLoading(true);
      const isStarting = /^(시작|시작하기|start|commencer|commence)$/i.test(text.trim());
      const loadingText = COURSE.avatar
        ? (isStarting ? AVATAR_TEXT.loadingStart : AVATAR_TEXT.loadingNext)
        : IS_MATH
        ? (isStarting ? "새 수학 문제를 만들고 검산하고 있습니다…" : "답을 확인하고 다음 단계를 준비하고 있습니다…")
        : IS_KOREAN
          ? (isStarting ? "새 국어 지문과 문제를 만들고 검토하고 있습니다…" : "답의 근거를 확인하고 다음 문제를 준비하고 있습니다…")
          : IS_SOCIAL
            ? (isStarting ? "새 사회 자료와 문제를 만들고 검토하고 있습니다…" : "답과 자료의 근거를 확인하고 다음 문제를 준비하고 있습니다…")
            : IS_HISTORY
              ? (isStarting ? "새 한국사 자료와 문제를 만들고 사실을 검토하고 있습니다…" : "답의 역사적 근거를 확인하고 다음 문제를 준비하고 있습니다…")
              : IS_SCIENCE
                ? (isStarting ? "새 과학 자료와 문제를 만들고 검산하고 있습니다…" : "답의 과학적 근거를 확인하고 다음 문제를 준비하고 있습니다…")
                : IS_ENGLISH
                  ? (isStarting ? "새 영어 활동과 문제를 만들고 검토하고 있습니다…" : "영어 답을 확인하고 다음 활동을 준비하고 있습니다…")
                  : (isStarting ? "첫 단어를 준비하고 있습니다…" : "발음을 확인하고 다음 단어를 준비하고 있습니다…");
      const typing = addMessage("assistant", loadingText, "typing");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            courseId: COURSE_ID,
            messages,
            history: IS_GENERATIVE_LESSON ? courseHistory : [],
            lessonSeed,
            inputMode
          })
        });
        const data = await readJsonResponse(response, COURSE.avatar ? AVATAR_TEXT.serverUnavailable : "AI 선생님 서버가 잠시 응답하지 않습니다. 잠시 후 다시 시도해 주세요.");
        if (!response.ok) throw new Error(data.error || (COURSE.avatar ? AVATAR_TEXT.connectionFailed : "수업 연결에 실패했습니다."));

        typing.remove();
        const protectedText = COURSE.avatar && isStarting
          ? keepOnlyFirstAvatarQuestion(data.text)
          : data.text;
        const cleanedAvatarText = COURSE.avatar
          ? cleanAvatarReply(protectedText, text)
          : protectedText;
        const answerReadyText = COURSE.avatar && /\b(?:hint|help|i\s+don'?t\s+know|i\s+don'?t\s+understand|indice|aide|je\s+ne\s+sais\s+pas|je\s+ne\s+comprends\s+pas)\b/i.test(text)
          ? cleanedAvatarText
          : ensureVisibleAnswerSlot(cleanedAvatarText);
        lastAssistantText = cleanForDisplay(answerReadyText);
        addMessage("assistant", lastAssistantText);
        messages.push({ role: "assistant", content: answerReadyText });
        rememberGeneratedProblem(answerReadyText);
        if (COURSE.voice || autoSpeak) await speakText(lastAssistantText);
        if (/(?:오늘의|이번)\s+.+수업을\s+마쳤|수업\s+종료|학습을\s+마쳤|lesson (?:is )?(?:complete|completed|finished)|you (?:have |'ve )?completed (?:today's |this )?lesson/i.test(lastAssistantText)) {
          await finishLesson(false);
        }
      } catch (error) {
        typing.remove();
        addMessage("assistant", error.message || "수업 연결 중 문제가 발생했습니다.");
        connection.innerHTML = COURSE.avatar
          ? `<strong>${AVATAR_TEXT.status}</strong> ${AVATAR_TEXT.checkConnection}`
          : "<strong>상태</strong> 연결 확인 필요";
      } finally {
        setLoading(false);
        if (isMobileAvatarLesson()) settleMobileLessonView();
        else input.focus();
        scheduleRecording(450);
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendMessage(text);
    });

    document.getElementById("restart").addEventListener("click", async () => {
      const restartButton = document.getElementById("restart");
      restartButton.disabled = true;
      connection.innerHTML = COURSE.avatar
        ? `<strong>${AVATAR_TEXT.status}</strong> ${AVATAR_TEXT.preparingNew}`
        : "<strong>상태</strong> 새 수업 기록 준비 중";
      try {
        await sessionRequest({ action: "restart", courseId: COURSE_ID });
        lessonManuallyEnded = false;
        sessionEnded = false;
        sessionEnding = false;
        messages.length = 0;
        lessonSeed = (globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`);
        chat.replaceChildren();
        lastAssistantText = COURSE.greeting;
        addMessage("assistant", COURSE.avatar ? `${AVATAR_TEXT.newReadyMessage} ${COURSE.greeting}` : `새 수업을 준비했습니다. ${COURSE.greeting}`);
        connection.innerHTML = COURSE.avatar ? `<strong>${AVATAR_TEXT.status}</strong> ${AVATAR_TEXT.newReady}` : "<strong>상태</strong> 새 수업 기록 중";
        input.disabled = false;
        sendButton.disabled = false;
        micButton.disabled = false;
        endLessonButton.disabled = false;
        if (isMobileAvatarLesson()) settleMobileLessonView();
        else input.focus();
      } catch (error) {
        addMessage("assistant", error.message || (COURSE.avatar
          ? AVATAR_TEXT.newFailed
          : "새 수업 기록을 준비하지 못했습니다."));
        connection.innerHTML = COURSE.avatar
          ? `<strong>${AVATAR_TEXT.status}</strong> ${AVATAR_TEXT.checkConnection}`
          : "<strong>상태</strong> 학생관리 연결 확인 필요";
      } finally {
        restartButton.disabled = false;
      }
    });

    document.getElementById("speak").addEventListener("click", () => {
      if (COURSE.voice) speakText(lastAssistantText);
    });

    teacherVolumeInput.addEventListener("input", () => {
      teacherVolume = Math.min(1, Math.max(0.05, Number(teacherVolumeInput.value) / 100));
      teacherVolumeValue.textContent = `${Math.round(teacherVolume * 100)}%`;
      localStorage.setItem(VOLUME_KEY, String(teacherVolume));
      if (currentAudio) currentAudio.volume = teacherVolume;
    });

    async function toggleConversation() {
      conversationMode = !conversationMode;
      autoSpeak = conversationMode;
      document.body.classList.toggle("voice-conversation", conversationMode && COURSE.avatar);
      micButton.textContent = conversationMode
        ? (COURSE.avatar ? AVATAR_TEXT.stopVoice : "■ 음성 대화 멈춤")
        : (COURSE.avatar ? AVATAR_TEXT.startVoice : "🎙 음성 대화 시작");
      if (conversationMode) {
        settleMobileLessonView();
        discardRecording = false;
        connection.innerHTML = COURSE.avatar
          ? `<strong>${AVATAR_TEXT.status}</strong> ${AVATAR_TEXT.preparingListen}`
          : "<strong>상태</strong> 학생 음성 준비 중";
        // The question has already been spoken. Start listening immediately so
        // an answer given right after the button click is never missed.
        startRecording();
      } else {
        settleMobileLessonView();
        clearTimeout(nextRecordingTimer);
        nextRecordingTimer = null;
        discardRecording = true;
        if (recorder?.state === "recording") {
          recorder.stop();
        } else {
          resetMic(true);
          discardRecording = false;
        }
        currentAudio?.pause();
        window.speechSynthesis?.cancel();
        connection.innerHTML = COURSE.avatar
          ? `<strong>${AVATAR_TEXT.status}</strong> ${AVATAR_TEXT.inProgress}`
          : "<strong>상태</strong> 수업 진행 중";
      }
    }

    mathToolsToggle.addEventListener("click", () => {
      const open = mathTools.classList.toggle("open");
      mathToolsToggle.textContent = COURSE.avatar
        ? (open ? AVATAR_TEXT.closeMathTools : AVATAR_TEXT.mathTools)
        : (open ? "⌨ 입력 도구 닫기" : "⌨ 수학 입력 도구");
    });

    document.querySelectorAll(".math-key").forEach((button) => {
      button.addEventListener("click", () => {
        const value = button.dataset.insert || "";
        const start = input.selectionStart ?? input.value.length;
        const end = input.selectionEnd ?? input.value.length;
        input.value = input.value.slice(0, start) + value + input.value.slice(end);
        const cursor = value === "()" || value === "sqrt()" ? start + value.length - 1 : start + value.length;
        input.focus();
        input.setSelectionRange(cursor, cursor);
      });
    });

    function closeLargeModal() {
      largeModal.classList.remove("open");
    }
    document.getElementById("modal-close").addEventListener("click", closeLargeModal);
    largeModal.addEventListener("click", (event) => {
      if (event.target === largeModal) closeLargeModal();
    });

    function resetMic(releaseStream = false) {
      clearTimeout(recordingTimer);
      clearInterval(recordingCountdownTimer);
      clearInterval(audioLevelTimer);
      audioContext?.close().catch(() => {});
      audioContext = null;
      if (releaseStream) {
        recordingStream?.getTracks().forEach((track) => track.stop());
        recordingStream = null;
      }
      recorder = null;
      recordingStarting = false;
      micButton.classList.remove("listening");
      micButton.textContent = conversationMode
        ? (COURSE.avatar ? AVATAR_TEXT.stopVoice : "■ 음성 대화 멈춤")
        : (COURSE.avatar ? AVATAR_TEXT.startVoice : "🎙 음성 대화 시작");
    }

    function stopLessonMedia() {
      lessonManuallyEnded = true;
      conversationMode = false;
      autoSpeak = false;
      discardRecording = true;
      clearTimeout(nextRecordingTimer);
      nextRecordingTimer = null;
      clearTimeout(recordingTimer);
      clearInterval(recordingCountdownTimer);
      clearInterval(audioLevelTimer);
      if (recorder?.state === "recording") recorder.stop();
      recordingStream?.getTracks().forEach((track) => track.stop());
      recordingStream = null;
      currentAudio?.pause();
      currentAudio = null;
      currentSpeechResolve?.();
      currentSpeechResolve = null;
      window.speechSynthesis?.cancel();
      window.dispatchEvent(new CustomEvent("gem-avatar-speaking", { detail: { speaking: false } }));
      resetMic(true);
      input.disabled = true;
      sendButton.disabled = true;
      micButton.disabled = true;
    }

    async function finishLesson(returnToEntrance = false) {
      stopLessonMedia();
      endLessonButton.disabled = true;
      connection.innerHTML = COURSE.avatar
        ? `<strong>${AVATAR_TEXT.status}</strong> ${AVATAR_TEXT.ended}`
        : "<strong>상태</strong> 수업 종료·기록 저장";
      await endCourseTracking();
      if (returnToEntrance) {
        location.href = "/";
        return;
      }
      addMessage("assistant", COURSE.avatar
        ? AVATAR_TEXT.endMessage
        : "오늘 수업을 마쳤습니다. 수고하셨습니다! 준비되면 ‘입구로 돌아가기’를 선택해 주세요.");
    }

    function scheduleRecording(delay = 500) {
      clearTimeout(nextRecordingTimer);
      nextRecordingTimer = null;
      if (lessonManuallyEnded || !conversationMode || input.disabled) return;
      nextRecordingTimer = setTimeout(() => {
        nextRecordingTimer = null;
        startRecording();
      }, delay);
    }

    async function transcribeRecording(blob) {
      connection.innerHTML = COURSE.avatar
        ? `<strong>${AVATAR_TEXT.status}</strong> ${AVATAR_TEXT.recognizing}`
        : "<strong>상태</strong> 학생 음성 인식 중";
      micButton.disabled = true;
      let sentToTeacher = false;
      try {
        const audio = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(",")[1]);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
        const response = await fetch("/api/transcribe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            audio,
            mimeType: blob.type,
            courseId: COURSE_ID,
            context: lastAssistantText
          })
        });
        const data = await readJsonResponse(response, COURSE.avatar
          ? AVATAR_TEXT.recognitionUnavailable
          : "음성 인식 서버가 잠시 응답하지 않습니다. 잠시 후 다시 말해 주세요.");
        if (!response.ok) throw new Error(data.error || "음성 인식 실패");
        voiceFailureNoticeShown = false;
        input.value = data.text;
        connection.innerHTML = COURSE.avatar
          ? `<strong>${AVATAR_TEXT.heard}</strong> ${data.text}`
          : `<strong>인식</strong> ${data.text}`;
        // The recognized answer is already rendered as a user message. Clear
        // the input so the previous answer never remains under the next problem.
        input.value = "";
        sentToTeacher = true;
        await sendMessage(data.text, "voice");
      } catch (error) {
        if (!voiceFailureNoticeShown) {
          addMessage("assistant", error.message || (COURSE.avatar
            ? AVATAR_TEXT.notUnderstood
            : "목소리를 알아듣지 못했습니다. 다시 말해 주세요."));
          voiceFailureNoticeShown = true;
        }
      } finally {
        micButton.disabled = false;
        if (!input.disabled) connection.innerHTML = COURSE.avatar
          ? `<strong>${AVATAR_TEXT.status}</strong> ${AVATAR_TEXT.inProgress}`
          : "<strong>상태</strong> 수업 진행 중";
        // A successful answer is restarted by sendMessage after the teacher has
        // finished speaking. Only transcription failures restart from here.
        if (!sentToTeacher) scheduleRecording(700);
      }
    }

    async function startRecording() {
      if (!COURSE.voice && !conversationMode && !IS_MATH) return;
      if (input.disabled || recordingStarting || recorder?.state === "recording") return;
      if (!navigator.mediaDevices?.getUserMedia || !("MediaRecorder" in window)) {
        addMessage("assistant", COURSE.avatar
          ? AVATAR_TEXT.voiceUnsupported
          : "이 브라우저에서는 음성 입력을 지원하지 않습니다. 최신 Chrome 또는 Edge에서 이용해 주세요.");
        return;
      }
      recordingStarting = true;
      try {
        currentAudio?.pause();
        window.speechSynthesis?.cancel();
        let stream = recordingStream;
        const hasLiveTrack = stream?.active
          && stream.getAudioTracks().some((track) => track.readyState === "live");
        if (!hasLiveTrack) {
          recordingStream?.getTracks().forEach((track) => track.stop());
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
              channelCount: 1
            }
          });
          recordingStream = stream;
        }
        if (!conversationMode) {
          stream.getTracks().forEach((track) => track.stop());
          recordingStream = null;
          recordingStarting = false;
          discardRecording = false;
          return;
        }
        heardSpeech = false;
        speechFrameCount = 0;
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioContext.createMediaStreamSource(recordingStream);
          const analyser = audioContext.createAnalyser();
          analyser.fftSize = 1024;
          source.connect(analyser);
          const levels = new Uint8Array(analyser.fftSize);
          audioLevelTimer = setInterval(() => {
            analyser.getByteTimeDomainData(levels);
            let energy = 0;
            for (const level of levels) {
              const sample = (level - 128) / 128;
              energy += sample * sample;
            }
            if (Math.sqrt(energy / levels.length) > 0.012) {
              speechFrameCount += 1;
              if (speechFrameCount >= 2) heardSpeech = true;
            }
          }, 100);
        } catch (error) {
          console.warn("Voice level detection unavailable", error);
          heardSpeech = true;
        }
        const chunks = [];
        const preferredType = MediaRecorder.isTypeSupported?.("audio/webm;codecs=opus")
          ? "audio/webm;codecs=opus"
          : "";
        const activeRecorder = preferredType
          ? new MediaRecorder(recordingStream, { mimeType: preferredType })
          : new MediaRecorder(recordingStream);
        recorder = activeRecorder;
        activeRecorder.addEventListener("dataavailable", (event) => {
          if (event.data.size) chunks.push(event.data);
        });
        activeRecorder.addEventListener("stop", () => {
          const blob = new Blob(chunks, { type: activeRecorder.mimeType || "audio/webm" });
          const shouldDiscard = discardRecording || !conversationMode;
          resetMic(shouldDiscard);
          if (shouldDiscard) {
            discardRecording = false;
            return;
          }
          // MediaRecorder is the source of truth. Some browsers suspend the
          // AudioContext level meter even while the microphone records normally.
          if (blob.size > 500) {
            transcribeRecording(blob);
          } else {
            if (!voiceFailureNoticeShown) {
              addMessage("assistant", COURSE.avatar
                ? AVATAR_TEXT.notHeard
                : "목소리가 녹음되지 않았습니다. 마이크 가까이에서 다시 말해 주세요.");
              voiceFailureNoticeShown = true;
            }
            scheduleRecording(700);
          }
        });
        activeRecorder.addEventListener("error", (event) => {
          console.error("MediaRecorder error", event.error || event);
          resetMic(true);
          addMessage("assistant", COURSE.avatar
            ? AVATAR_TEXT.restartVoice
            : "음성 녹음 연결을 다시 시작해 주세요.");
          scheduleRecording(1200);
        });
        // One complete container per answer is more reliable than concatenating
        // time-sliced WebM fragments across repeated recording sessions.
        activeRecorder.start();
        recordingStarting = false;
        micButton.classList.add("listening");
        micButton.textContent = COURSE.avatar ? AVATAR_TEXT.stopVoice : "■ 음성 대화 멈춤";
        let remaining = conversationMode ? 10 : 8;
        connection.innerHTML = COURSE.avatar
          ? `<strong>${AVATAR_TEXT.status}</strong> ${AVATAR_TEXT.listening} (${remaining}s)`
          : `<strong>상태</strong> 학생 음성 듣는 중 (${remaining}초)`;
        recordingCountdownTimer = setInterval(() => {
          remaining -= 1;
          if (remaining > 0 && recorder?.state === "recording") {
            connection.innerHTML = COURSE.avatar
              ? `<strong>${AVATAR_TEXT.status}</strong> ${AVATAR_TEXT.listening} (${remaining}s)`
              : `<strong>상태</strong> 학생 음성 듣는 중 (${remaining}초)`;
          }
        }, 1000);
        recordingTimer = setTimeout(() => {
          if (recorder?.state === "recording") recorder.stop();
        }, conversationMode ? 10000 : 8000);
      } catch (error) {
        recordingStarting = false;
        resetMic(true);
        addMessage("assistant", COURSE.avatar
          ? AVATAR_TEXT.allowMic
          : "마이크 사용을 허용한 뒤 다시 눌러 주세요.");
      }
    }

    micButton.addEventListener("click", toggleConversation);
    endLessonButton.addEventListener("click", () => finishLesson(false));
    backEntranceButton.addEventListener("click", () => finishLesson(true));
    document.getElementById("avatar-start").addEventListener("click", () => {
      if (!lessonManuallyEnded) sendMessage(IS_FRENCH ? "Commencer" : "Start");
    });
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { VRMLoaderPlugin, VRMUtils } from "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.0/lib/three-vrm.module.min.js";

    const avatarCourseId = new URLSearchParams(location.search).get("course");
    const avatarCourse = avatarCourseId === "g3-math-en" || avatarCourseId === "g3-math-fr";
    const avatarLanguage = avatarCourseId === "g3-math-fr" ? "fr" : "en";
    if (avatarCourse) {
      const stage = document.getElementById("avatar-stage");
      const canvas = document.getElementById("avatar-canvas");
      const loading = document.getElementById("avatar-loading");
      const toggle = document.getElementById("avatar-toggle");
      const visibleKey = "gem-avatar-visible";
      let avatarVisible = localStorage.getItem(visibleKey) !== "false";

      function applyVisibility() {
        stage.classList.toggle("hidden-avatar", !avatarVisible);
        document.body.classList.toggle("avatar-hidden", !avatarVisible);
        toggle.setAttribute("aria-pressed", String(!avatarVisible));
        toggle.textContent = avatarLanguage === "fr"
          ? (avatarVisible ? "Masquer l’avatar" : "Afficher l’avatar")
          : (avatarVisible ? "Hide avatar" : "Show avatar");
        localStorage.setItem(visibleKey, String(avatarVisible));
        requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));
      }
      toggle.addEventListener("click", () => {
        avatarVisible = !avatarVisible;
        applyVisibility();
      });
      applyVisibility();

      try {
        const isSmallScreen = window.matchMedia("(max-width: 520px)").matches;
        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: !isSmallScreen,
          alpha: true,
          powerPreference: "high-performance"
        });
        renderer.setPixelRatio(Math.min(devicePixelRatio, isSmallScreen ? 1.35 : 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
        camera.position.set(0, 1.35, 3.1);
        scene.add(new THREE.HemisphereLight(0xffffff, 0x7890aa, 2.2));
        const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
        keyLight.position.set(1.5, 2.4, 2.5);
        scene.add(keyLight);

        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));
        const gltf = await loader.loadAsync("/assets/avatar-sample-z.vrm");
        const vrm = gltf.userData.vrm;
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.combineSkeletons(gltf.scene);
        VRMUtils.rotateVRM0(vrm);
        scene.add(vrm.scene);

        const box = new THREE.Box3().setFromObject(vrm.scene);
        const center = box.getCenter(new THREE.Vector3());
        const height = Math.max(box.getSize(new THREE.Vector3()).y, 1);
        vrm.scene.position.x -= center.x;
        vrm.scene.position.y -= box.min.y;
        const targetHeight = height * 0.54;
        camera.position.set(0, targetHeight, height * 1.42);
        camera.lookAt(0, targetHeight, 0);
        loading.hidden = true;

        const clock = new THREE.Clock();
        let elapsed = 0;
        let nextBlink = 2.2;
        let avatarSpeaking = false;
        window.addEventListener("gem-avatar-speaking", (event) => {
          avatarSpeaking = Boolean(event.detail?.speaking);
        });

        const hips = vrm.humanoid?.getNormalizedBoneNode("hips");
        const chest = vrm.humanoid?.getNormalizedBoneNode("chest");
        const leftUpperArm = vrm.humanoid?.getNormalizedBoneNode("leftUpperArm");
        const rightUpperArm = vrm.humanoid?.getNormalizedBoneNode("rightUpperArm");
        const leftLowerArm = vrm.humanoid?.getNormalizedBoneNode("leftLowerArm");
        const rightLowerArm = vrm.humanoid?.getNormalizedBoneNode("rightLowerArm");
        const leftHand = vrm.humanoid?.getNormalizedBoneNode("leftHand");
        const rightHand = vrm.humanoid?.getNormalizedBoneNode("rightHand");

        // VRM models load in a T-pose. These rotations form a relaxed teacher
        // stance before the first frame so the avatar never flashes a T-pose.
        if (leftUpperArm) leftUpperArm.rotation.z = -1.18;
        if (rightUpperArm) rightUpperArm.rotation.z = 1.18;
        if (leftLowerArm) leftLowerArm.rotation.y = -0.12;
        if (rightLowerArm) rightLowerArm.rotation.y = 0.12;
        if (leftHand) leftHand.rotation.z = -0.08;
        if (rightHand) rightHand.rotation.z = 0.08;

        function resize() {
          const width = Math.max(canvas.clientWidth, 1);
          const heightPx = Math.max(canvas.clientHeight, 1);
          renderer.setSize(width, heightPx, false);
          camera.aspect = width / heightPx;
          // A narrow phone canvas needs a little more distance to keep the
          // teacher's complete body and gestures inside the frame.
          const narrowScreenFactor = camera.aspect < 0.9 ? 1.18 : 1;
          camera.position.z = height * 1.42 * narrowScreenFactor;
          camera.updateProjectionMatrix();
        }
        new ResizeObserver(resize).observe(stage);
        resize();

        function animate() {
          requestAnimationFrame(animate);
          const delta = Math.min(clock.getDelta(), 0.05);
          elapsed += delta;
          const head = vrm.humanoid?.getNormalizedBoneNode("head");
          if (head) {
            head.rotation.y = Math.sin(elapsed * 0.55) * 0.035;
            head.rotation.z = Math.sin(elapsed * 0.8) * 0.012;
          }
          const breath = Math.sin(elapsed * 1.7);
          if (hips) hips.position.y = breath * 0.0025;
          if (chest) {
            chest.rotation.x = breath * 0.012;
            chest.rotation.y = avatarSpeaking ? Math.sin(elapsed * 1.8) * 0.018 : 0;
          }

          // Keep both arms relaxed. While speaking, the right arm makes a
          // small classroom gesture rather than swinging continuously.
          if (leftUpperArm) leftUpperArm.rotation.z = -1.18 + breath * 0.012;
          if (rightUpperArm) {
            const gesture = avatarSpeaking ? (Math.sin(elapsed * 2.2) + 1) * 0.10 : 0;
            rightUpperArm.rotation.z = 1.18 - gesture;
            rightUpperArm.rotation.x = avatarSpeaking ? Math.sin(elapsed * 1.35) * 0.08 : 0;
          }
          if (leftLowerArm) leftLowerArm.rotation.y = -0.12;
          if (rightLowerArm) rightLowerArm.rotation.y = avatarSpeaking ? 0.30 : 0.12;

          // Simple audio-synchronised mouth movement. The expression is kept
          // deliberately subtle so it looks natural on a classroom TV.
          const mouthOpen = avatarSpeaking
            ? 0.18 + Math.abs(Math.sin(elapsed * 9.2)) * 0.42
            : 0;
          vrm.expressionManager?.setValue("aa", mouthOpen);
          if (elapsed > nextBlink) {
            const phase = elapsed - nextBlink;
            const blink = phase < 0.11 ? phase / 0.11 : phase < 0.22 ? 1 - (phase - 0.11) / 0.11 : 0;
            vrm.expressionManager?.setValue("blink", Math.max(0, blink));
            if (phase >= 0.22) nextBlink = elapsed + 2.4 + Math.random() * 2.8;
          }
          vrm.scene.rotation.y = Math.sin(elapsed * 0.32) * 0.018;
          vrm.update(delta);
          if (avatarVisible) renderer.render(scene, camera);
        }
        animate();
      } catch (error) {
        console.error("Avatar loading failed", error);
        loading.classList.add("avatar-error");
        loading.textContent = "The avatar could not load, but the lesson is still available.";
      }
    }
  </script>

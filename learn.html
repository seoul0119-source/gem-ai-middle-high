<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEM AI Learning Mission Class</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --navy: #07162d;
      --blue: #1e67c6;
      --blue-dark: #144f9d;
      --gold: #e7c46a;
      --ink: #172033;
      --muted: #657186;
      --paper: #ffffff;
      --bg: #eef3fa;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 24px 18px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, var(--navy), #173d70);
    }
    .brand {
      margin-bottom: 7px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    h1 { margin: 0; font-size: clamp(23px, 5vw, 32px); }
    header p { margin: 9px 0 0; color: #dce6f5; }
    main {
      width: min(760px, 94%);
      margin: 20px auto 36px;
    }
    .status {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 12px 16px;
      border: 1px solid #d6dfeb;
      border-radius: 14px;
      background: var(--paper);
      color: var(--muted);
      font-size: 14px;
    }
    .status strong { color: #173d70; }
    .chat {
      min-height: 430px;
      max-height: 62vh;
      overflow-y: auto;
      padding: 18px;
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 8px 24px rgba(7, 22, 45, .10);
    }
    .message {
      width: fit-content;
      max-width: 88%;
      margin: 0 0 14px;
      padding: 13px 15px;
      border-radius: 16px;
      white-space: pre-wrap;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }
    .assistant {
      margin-right: auto;
      border: 1px solid #d8e3f2;
      border-bottom-left-radius: 5px;
      background: #f4f8fe;
    }
    .user {
      margin-left: auto;
      border-bottom-right-radius: 5px;
      background: var(--blue);
      color: white;
    }
    .typing { color: var(--muted); font-style: italic; }
    form {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    input {
      min-width: 0;
      flex: 1;
      padding: 15px 16px;
      border: 2px solid #cbd7e7;
      border-radius: 13px;
      font-size: 17px;
      outline: none;
    }
    input:focus { border-color: var(--blue); }
    button {
      border: 0;
      border-radius: 13px;
      background: var(--blue);
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--blue-dark); }
    button:disabled { cursor: wait; opacity: .65; }
    .send { min-width: 88px; padding: 0 18px; }
    .mic {
      min-width: 104px;
      padding: 0 15px;
      background: #16805d;
    }
    .mic:hover { background: #106649; }
    .mic.listening { background: #c43d4d; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 10px;
    }
    .secondary {
      padding: 10px 13px;
      border: 1px solid #cbd7e7;
      background: white;
      color: #173d70;
      font-size: 14px;
    }
    .secondary:hover { background: #f4f8fe; }
    .notice {
      margin-top: 16px;
      padding: 13px 15px;
      border: 1px solid #ecd38c;
      border-radius: 13px;
      background: #fff8e5;
      color: #594a22;
      font-size: 13px;
      line-height: 1.6;
    }
    .math-tools {
      display: none;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #cbd7e7;
      border-radius: 14px;
      background: white;
    }
    .math-tools.open { display: block; }
    .tool-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .math-key {
      min-width: 62px;
      padding: 9px 11px;
      border: 1px solid #b9c9de;
      background: #f4f8fe;
      color: #173d70;
      font-size: 15px;
    }
    .math-help { margin: 10px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .large-view {
      display: block;
      margin-top: 9px;
      padding: 7px 10px;
      border: 1px solid #afc4df;
      background: white;
      color: #173d70;
      font-size: 13px;
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(7, 22, 45, .68);
    }
    .modal.open { display: flex; }
    .modal-card {
      width: min(900px, 98vw);
      max-height: 88vh;
      overflow: auto;
      padding: 22px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 14px 45px rgba(0, 0, 0, .3);
    }
    .modal-text { white-space: pre-wrap; font-size: clamp(19px, 3vw, 28px); line-height: 1.8; }
    .modal-close { float: right; padding: 9px 13px; }
    @media (max-width: 520px) {
      main { width: 96%; margin-top: 10px; }
      .chat { min-height: 390px; padding: 13px; }
      .message { max-width: 94%; }
      .status { flex-direction: column; gap: 4px; }
      .send { min-width: 72px; padding: 0 12px; }
      form { flex-wrap: wrap; }
      input { flex-basis: calc(100% - 84px); }
      .mic { order: 3; width: 100%; min-height: 48px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">GEM AI LEARNING MISSION CLASS</div>
    <h1 id="course-title">GEM AI 수업</h1>
    <p>AI가 가르치고, 사람 교사가 책임집니다.</p>
  </header>

  <main>
    <section class="status" aria-label="수업 상태">
      <span><strong>과목</strong> <span id="course-subject">수업</span></span>
      <span><strong>학년</strong> <span id="course-grade">중학교 1학년</span></span>
      <span id="connection"><strong>상태</strong> 수업 준비</span>
    </section>

    <section id="chat" class="chat" aria-live="polite" aria-label="수업 대화">
      <div id="initial-message" class="message assistant">수업을 준비하고 있습니다.</div>
    </section>

    <form id="chat-form">
      <input id="message" type="text" placeholder="시작 또는 답을 입력하세요" autocomplete="off" maxlength="3000" required>
      <button id="mic" class="mic" type="button">🎤 말하기</button>
      <button id="send" class="send" type="submit">보내기</button>
    </form>

    <div class="actions">
      <button id="speak" class="secondary" type="button">🔊 다시 듣기</button>
      <button id="auto-speak" class="secondary" type="button" hidden>🔊 음성 계속</button>
      <button id="math-tools-toggle" class="secondary" type="button" hidden>⌨ 수학 입력 도구</button>
      <button id="restart" class="secondary" type="button">↻ 새 수업</button>
    </div>

    <section id="math-tools" class="math-tools" aria-label="수학 입력 도구">
      <div class="tool-grid">
        <button class="math-key" type="button" data-insert="^2">x²</button>
        <button class="math-key" type="button" data-insert="^3">x³</button>
        <button class="math-key" type="button" data-insert="sqrt()">√</button>
        <button class="math-key" type="button" data-insert="/">분수 /</button>
        <button class="math-key" type="button" data-insert="<=">≤</button>
        <button class="math-key" type="button" data-insert=">=">≥</button>
        <button class="math-key" type="button" data-insert="!=">≠</button>
        <button class="math-key" type="button" data-insert="pi">π</button>
        <button class="math-key" type="button" data-insert="()">( )</button>
        <button class="math-key" type="button" data-insert="|x|">|x|</button>
        <button class="math-key" type="button" data-insert=" 합집합 ">∪</button>
        <button class="math-key" type="button" data-insert=" 교집합 ">∩</button>
      </div>
      <p class="math-help">예: x²는 x^2 · √2는 sqrt(2) · 2/3 · x≤3은 x&lt;=3 · 집합은 {1,2,3}처럼 입력합니다.</p>
    </section>

    <div class="notice">
      이 수업은 보호자 또는 교사의 지도 아래 이용합니다. 이름·학교·주소·전화번호 등 개인정보를 입력하지 마세요.
    </div>
  </main>

  <div id="large-modal" class="modal" role="dialog" aria-modal="true" aria-label="도표 크게 보기">
    <div class="modal-card">
      <button id="modal-close" class="modal-close" type="button">닫기</button>
      <div id="modal-text" class="modal-text"></div>
    </div>
  </div>

  <script>
    const COURSE_CONFIGS = {
      "m1-english-word": {
        title: "중1 영어 단어 Lv.7",
        subject: "영어 단어",
        grade: "중학교 1학년",
        greeting: "안녕하세요! “시작”이라고 입력하면 중1 영어 단어 수업을 바로 시작합니다.",
        placeholder: "시작 또는 답을 입력하세요",
        voice: true
      },
      "m1-math": {
        title: "중1 수학 Lv.7 시험판",
        subject: "수학",
        grade: "중학교 1학년",
        greeting: "안녕하세요! “시작”이라고 입력하면 새로운 중1 수학 문제 10개를 한 문제씩 시작합니다.",
        placeholder: "시작, 답 또는 힌트를 입력하세요",
        voice: false
      }
    };
    const requestedCourse = new URLSearchParams(location.search).get("course");
    const COURSE_ID = COURSE_CONFIGS[requestedCourse] ? requestedCourse : "m1-english-word";
    const COURSE = COURSE_CONFIGS[COURSE_ID];
    const messages = [];
    const chat = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const micButton = document.getElementById("mic");
    const connection = document.getElementById("connection");
    const autoSpeakButton = document.getElementById("auto-speak");
    const mathToolsToggle = document.getElementById("math-tools-toggle");
    const mathTools = document.getElementById("math-tools");
    const largeModal = document.getElementById("large-modal");
    const modalText = document.getElementById("modal-text");
    const HISTORY_KEY = `gem-course-history:${COURSE_ID}`;
    let courseHistory = [];
    try {
      const savedHistory = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
      courseHistory = Array.isArray(savedHistory) ? savedHistory.slice(-60) : [];
    } catch (_) {
      courseHistory = [];
    }
    let lastAssistantText = COURSE.greeting;
    let recorder = null;
    let recordingStream = null;
    let recordingChunks = [];
    let recordingTimer = null;
    let recordingCountdownTimer = null;
    let currentAudio = null;
    let autoSpeak = false;
    let conversationMode = false;
    let discardRecording = false;

    document.title = `GEM AI ${COURSE.title}`;
    document.getElementById("course-title").textContent = COURSE.title;
    document.getElementById("course-subject").textContent = COURSE.subject;
    document.getElementById("course-grade").textContent = COURSE.grade;
    document.getElementById("initial-message").textContent = COURSE.greeting;
    input.placeholder = COURSE.placeholder;
    autoSpeakButton.hidden = false;
    autoSpeakButton.textContent = "🎙 음성 대화 시작";
    if (!COURSE.voice) {
      micButton.hidden = false;
      micButton.textContent = "🎤 직접 말하기";
      document.getElementById("speak").hidden = true;
      mathToolsToggle.hidden = false;
    }

    function cleanForDisplay(text) {
      return String(text || "")
        .replace(/```[\s\S]*?```/g, (block) => block.replace(/```\w*|```/g, ""))
        .replace(/\*\*|__|`|#+\s?/g, "")
        .replace(/^\s*[-*]\s+/gm, "• ")
        .trim();
    }

    function cleanMathForSpeech(text) {
      return cleanForDisplay(text)
        .replace(/\[도표 시작\]|\[도표 끝\]/g, "")
        .replace(/sqrt\(([^)]+)\)/gi, "$1의 제곱근")
        .replace(/([A-Za-z0-9가-힣)])\^2/g, "$1의 제곱")
        .replace(/([A-Za-z0-9가-힣)])\^3/g, "$1의 세제곱")
        .replace(/≤|<=/g, " 이하 ")
        .replace(/≥|>=/g, " 이상 ")
        .replace(/≠|!=/g, " 같지 않음 ")
        .replace(/×|\*/g, " 곱하기 ")
        .replace(/÷/g, " 나누기 ")
        .replace(/π/g, " 파이 ")
        .replace(/∪/g, " 합집합 ")
        .replace(/∩/g, " 교집합 ");
    }

    function getVoice(language) {
      const voices = window.speechSynthesis.getVoices();
      const prefix = language.toLowerCase().split("-")[0];
      return voices.find((voice) => voice.lang.toLowerCase() === language.toLowerCase())
        || voices.find((voice) => voice.lang.toLowerCase().startsWith(prefix))
        || null;
    }

    function browserSpeak(text) {
      if (!("speechSynthesis" in window)) return;
      const clean = cleanForDisplay(text);
      if (!clean) return;
      window.speechSynthesis.cancel();

      const parts = clean.split(/\n+/).map((part) => part.trim()).filter(Boolean);
      parts.forEach((part) => {
        const latinCount = (part.match(/[A-Za-z]/g) || []).length;
        const koreanCount = (part.match(/[가-힣]/g) || []).length;
        const language = latinCount > koreanCount ? "en-US" : "ko-KR";
        const utterance = new SpeechSynthesisUtterance(part);
        utterance.lang = language;
        utterance.voice = getVoice(language);
        utterance.rate = language === "en-US" ? 0.78 : 0.9;
        utterance.pitch = 1;
        window.speechSynthesis.speak(utterance);
      });
    }

    async function speakText(text) {
      const clean = COURSE_ID === "m1-math" ? cleanMathForSpeech(text) : cleanForDisplay(text);
      if (!clean) return;
      if (currentAudio) currentAudio.pause();
      window.speechSynthesis?.cancel();

      try {
        const response = await fetch("/api/speech", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: clean })
        });
        const data = await response.json();
        if (!response.ok || !data.audio) throw new Error(data.error || "음성 생성 실패");
        currentAudio = new Audio(`data:${data.mimeType};base64,${data.audio}`);
        await currentAudio.play();
        await new Promise((resolve) => {
          currentAudio.addEventListener("ended", resolve, { once: true });
          currentAudio.addEventListener("error", resolve, { once: true });
        });
      } catch (error) {
        console.warn("Natural voice fallback", error);
        browserSpeak(clean);
      }
    }

    function addMessage(role, text, extraClass = "") {
      const element = document.createElement("div");
      element.className = `message ${role} ${extraClass}`.trim();
      element.textContent = text;
      if (role === "assistant" && COURSE_ID === "m1-math" && /(좌표|그래프|도표|표\s|도형|히스토그램|수직선|사분면)/.test(text)) {
        const expand = document.createElement("button");
        expand.type = "button";
        expand.className = "large-view";
        expand.textContent = "🔍 도표·문제 크게 보기";
        expand.addEventListener("click", () => {
          modalText.textContent = text;
          largeModal.classList.add("open");
        });
        element.appendChild(expand);
      }
      chat.appendChild(element);
      chat.scrollTop = chat.scrollHeight;
      return element;
    }

    function setLoading(loading) {
      input.disabled = loading;
      sendButton.disabled = loading;
      connection.innerHTML = loading
        ? "<strong>상태</strong> AI 선생님 응답 중"
        : "<strong>상태</strong> 수업 진행 중";
    }

    function rememberMathProblem(text) {
      if (COURSE_ID !== "m1-math") return;
      const clean = cleanForDisplay(text);
      const match = clean.match(/문제\s*\d+\s*\/\s*10[\s\S]*/i);
      if (!match) return;
      const problem = match[0].slice(0, 700).trim();
      if (!problem || courseHistory.includes(problem)) return;
      courseHistory.push(problem);
      courseHistory = courseHistory.slice(-60);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(courseHistory));
    }

    async function sendMessage(text) {
      addMessage("user", text);
      messages.push({ role: "user", content: text });
      setLoading(true);
      const isStarting = /^(시작|시작하기|start)$/i.test(text.trim());
      const loadingText = COURSE_ID === "m1-math"
        ? (isStarting ? "새 수학 문제를 만들고 검산하고 있습니다…" : "답을 확인하고 다음 단계를 준비하고 있습니다…")
        : (isStarting ? "첫 단어를 준비하고 있습니다…" : "발음을 확인하고 다음 단어를 준비하고 있습니다…");
      const typing = addMessage("assistant", loadingText, "typing");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            courseId: COURSE_ID,
            messages,
            history: COURSE_ID === "m1-math" ? courseHistory : []
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "수업 연결에 실패했습니다.");

        typing.remove();
        lastAssistantText = cleanForDisplay(data.text);
        addMessage("assistant", lastAssistantText);
        messages.push({ role: "assistant", content: data.text });
        rememberMathProblem(data.text);
        if (COURSE.voice || autoSpeak) await speakText(lastAssistantText);
      } catch (error) {
        typing.remove();
        addMessage("assistant", error.message || "수업 연결 중 문제가 발생했습니다.");
        connection.innerHTML = "<strong>상태</strong> 연결 확인 필요";
      } finally {
        setLoading(false);
        input.focus();
        if (conversationMode) setTimeout(startRecording, 250);
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendMessage(text);
    });

    document.getElementById("restart").addEventListener("click", () => {
      messages.length = 0;
      chat.replaceChildren();
      lastAssistantText = COURSE.greeting;
      addMessage("assistant", `새 수업을 준비했습니다. ${COURSE.greeting}`);
      connection.innerHTML = "<strong>상태</strong> 수업 준비";
      input.focus();
    });

    document.getElementById("speak").addEventListener("click", () => {
      if (COURSE.voice) speakText(lastAssistantText);
    });

    autoSpeakButton.addEventListener("click", async () => {
      conversationMode = !conversationMode;
      autoSpeak = conversationMode;
      autoSpeakButton.textContent = conversationMode ? "■ 음성 대화 멈춤" : "🎙 음성 대화 시작";
      if (conversationMode) {
        connection.innerHTML = "<strong>상태</strong> 음성 대화 시작";
        await speakText(lastAssistantText);
        if (conversationMode) startRecording();
      } else {
        discardRecording = true;
        if (recorder?.state === "recording") recorder.stop();
        currentAudio?.pause();
        window.speechSynthesis?.cancel();
        connection.innerHTML = "<strong>상태</strong> 수업 진행 중";
      }
    });

    mathToolsToggle.addEventListener("click", () => {
      const open = mathTools.classList.toggle("open");
      mathToolsToggle.textContent = open ? "⌨ 입력 도구 닫기" : "⌨ 수학 입력 도구";
    });

    document.querySelectorAll(".math-key").forEach((button) => {
      button.addEventListener("click", () => {
        const value = button.dataset.insert || "";
        const start = input.selectionStart ?? input.value.length;
        const end = input.selectionEnd ?? input.value.length;
        input.value = input.value.slice(0, start) + value + input.value.slice(end);
        const cursor = value === "()" || value === "sqrt()" ? start + value.length - 1 : start + value.length;
        input.focus();
        input.setSelectionRange(cursor, cursor);
      });
    });

    function closeLargeModal() {
      largeModal.classList.remove("open");
    }
    document.getElementById("modal-close").addEventListener("click", closeLargeModal);
    largeModal.addEventListener("click", (event) => {
      if (event.target === largeModal) closeLargeModal();
    });

    function resetMic() {
      clearTimeout(recordingTimer);
      clearInterval(recordingCountdownTimer);
      recordingStream?.getTracks().forEach((track) => track.stop());
      recordingStream = null;
      recorder = null;
      micButton.classList.remove("listening");
      micButton.textContent = COURSE_ID === "m1-math" ? "🎤 직접 말하기" : "🎤 말하기";
    }

    async function transcribeRecording(blob) {
      connection.innerHTML = "<strong>상태</strong> 학생 음성 인식 중";
      micButton.disabled = true;
      try {
        const audio = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(",")[1]);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
        const response = await fetch("/api/transcribe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ audio, mimeType: blob.type, courseId: COURSE_ID })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "음성 인식 실패");
        input.value = data.text;
        connection.innerHTML = `<strong>인식</strong> ${data.text}`;
        await sendMessage(data.text);
      } catch (error) {
        addMessage("assistant", error.message || "목소리를 알아듣지 못했습니다. 다시 말해 주세요.");
      } finally {
        micButton.disabled = false;
        if (!input.disabled) connection.innerHTML = "<strong>상태</strong> 수업 진행 중";
        if (conversationMode && !input.disabled) setTimeout(startRecording, 400);
      }
    }

    async function startRecording() {
      if (!COURSE.voice && !conversationMode && COURSE_ID !== "m1-math") return;
      if (input.disabled || recorder?.state === "recording") return;
      if (!navigator.mediaDevices?.getUserMedia || !("MediaRecorder" in window)) {
        addMessage("assistant", "이 브라우저에서는 음성 입력을 지원하지 않습니다. 최신 Chrome 또는 Edge에서 이용해 주세요.");
        return;
      }
      if (recorder?.state === "recording") {
        recorder.stop();
        return;
      }
      try {
        currentAudio?.pause();
        window.speechSynthesis?.cancel();
        recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordingChunks = [];
        const preferredType = MediaRecorder.isTypeSupported?.("audio/webm;codecs=opus")
          ? "audio/webm;codecs=opus"
          : "";
        recorder = preferredType
          ? new MediaRecorder(recordingStream, { mimeType: preferredType })
          : new MediaRecorder(recordingStream);
        recorder.addEventListener("dataavailable", (event) => {
          if (event.data.size) recordingChunks.push(event.data);
        });
        recorder.addEventListener("stop", () => {
          const blob = new Blob(recordingChunks, { type: recorder.mimeType || "audio/webm" });
          resetMic();
          if (discardRecording) {
            discardRecording = false;
            return;
          }
          if (blob.size > 500) {
            transcribeRecording(blob);
          } else {
            addMessage("assistant", "목소리가 녹음되지 않았습니다. 마이크 가까이에서 다시 말해 주세요.");
            if (conversationMode) setTimeout(startRecording, 700);
          }
        });
        recorder.addEventListener("error", (event) => {
          console.error("MediaRecorder error", event.error || event);
          resetMic();
          addMessage("assistant", "음성 녹음 연결을 다시 시작해 주세요.");
        });
        recorder.start(250);
        micButton.classList.add("listening");
        micButton.textContent = "■ 말 끝내기";
        let remaining = conversationMode ? 10 : 8;
        connection.innerHTML = `<strong>상태</strong> 학생 음성 듣는 중 (${remaining}초)`;
        recordingCountdownTimer = setInterval(() => {
          remaining -= 1;
          if (remaining > 0 && recorder?.state === "recording") {
            connection.innerHTML = `<strong>상태</strong> 학생 음성 듣는 중 (${remaining}초)`;
          }
        }, 1000);
        recordingTimer = setTimeout(() => {
          if (recorder?.state === "recording") recorder.stop();
        }, conversationMode ? 10000 : 8000);
      } catch (error) {
        resetMic();
        addMessage("assistant", "마이크 사용을 허용한 뒤 다시 눌러 주세요.");
      }
    }

    micButton.addEventListener("click", startRecording);
  </script>
</body>

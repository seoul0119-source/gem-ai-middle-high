<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEM AI 중1 영어 단어 Lv.7</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --navy: #07162d;
      --blue: #1e67c6;
      --blue-dark: #144f9d;
      --gold: #e7c46a;
      --ink: #172033;
      --muted: #657186;
      --paper: #ffffff;
      --bg: #eef3fa;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 24px 18px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, var(--navy), #173d70);
    }
    .brand {
      margin-bottom: 7px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    h1 { margin: 0; font-size: clamp(23px, 5vw, 32px); }
    header p { margin: 9px 0 0; color: #dce6f5; }
    main {
      width: min(760px, 94%);
      margin: 20px auto 36px;
    }
    .status {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 12px 16px;
      border: 1px solid #d6dfeb;
      border-radius: 14px;
      background: var(--paper);
      color: var(--muted);
      font-size: 14px;
    }
    .status strong { color: #173d70; }
    .chat {
      min-height: 430px;
      max-height: 62vh;
      overflow-y: auto;
      padding: 18px;
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 8px 24px rgba(7, 22, 45, .10);
    }
    .message {
      width: fit-content;
      max-width: 88%;
      margin: 0 0 14px;
      padding: 13px 15px;
      border-radius: 16px;
      white-space: pre-wrap;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }
    .assistant {
      margin-right: auto;
      border: 1px solid #d8e3f2;
      border-bottom-left-radius: 5px;
      background: #f4f8fe;
    }
    .user {
      margin-left: auto;
      border-bottom-right-radius: 5px;
      background: var(--blue);
      color: white;
    }
    .typing { color: var(--muted); font-style: italic; }
    form {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    input {
      min-width: 0;
      flex: 1;
      padding: 15px 16px;
      border: 2px solid #cbd7e7;
      border-radius: 13px;
      font-size: 17px;
      outline: none;
    }
    input:focus { border-color: var(--blue); }
    button {
      border: 0;
      border-radius: 13px;
      background: var(--blue);
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--blue-dark); }
    button:disabled { cursor: wait; opacity: .65; }
    .send { min-width: 88px; padding: 0 18px; }
    .actions {
      display: flex;
      gap: 9px;
      margin-top: 10px;
    }
    .secondary {
      padding: 10px 13px;
      border: 1px solid #cbd7e7;
      background: white;
      color: #173d70;
      font-size: 14px;
    }
    .secondary:hover { background: #f4f8fe; }
    .notice {
      margin-top: 16px;
      padding: 13px 15px;
      border: 1px solid #ecd38c;
      border-radius: 13px;
      background: #fff8e5;
      color: #594a22;
      font-size: 13px;
      line-height: 1.6;
    }
    @media (max-width: 520px) {
      main { width: 96%; margin-top: 10px; }
      .chat { min-height: 390px; padding: 13px; }
      .message { max-width: 94%; }
      .status { flex-direction: column; gap: 4px; }
      .send { min-width: 72px; padding: 0 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">GEM AI LEARNING MISSION CLASS</div>
    <h1>중1 영어 단어 Lv.7</h1>
    <p>AI가 가르치고, 사람 교사가 책임집니다.</p>
  </header>

  <main>
    <section class="status" aria-label="수업 상태">
      <span><strong>과목</strong> 영어 단어</span>
      <span><strong>학년</strong> 중학교 1학년</span>
      <span id="connection"><strong>상태</strong> 수업 준비</span>
    </section>

    <section id="chat" class="chat" aria-live="polite" aria-label="수업 대화">
      <div class="message assistant">안녕하세요! “시작”이라고 입력하면 중1 영어 단어 수업을 바로 시작합니다.</div>
    </section>

    <form id="chat-form">
      <input id="message" type="text" placeholder="시작 또는 답을 입력하세요" autocomplete="off" maxlength="3000" required>
      <button id="send" class="send" type="submit">보내기</button>
    </form>

    <div class="actions">
      <button id="speak" class="secondary" type="button">🔊 다시 듣기</button>
      <button id="restart" class="secondary" type="button">↻ 새 수업</button>
    </div>

    <div class="notice">
      이 수업은 보호자 또는 교사의 지도 아래 이용합니다. 이름·학교·주소·전화번호 등 개인정보를 입력하지 마세요.
    </div>
  </main>

  <script>
    const COURSE_ID = "m1-english-word";
    const messages = [];
    const chat = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const connection = document.getElementById("connection");
    let lastAssistantText = "안녕하세요! 시작이라고 입력하면 중1 영어 단어 수업을 바로 시작합니다.";

    function addMessage(role, text, extraClass = "") {
      const element = document.createElement("div");
      element.className = `message ${role} ${extraClass}`.trim();
      element.textContent = text;
      chat.appendChild(element);
      chat.scrollTop = chat.scrollHeight;
      return element;
    }

    function setLoading(loading) {
      input.disabled = loading;
      sendButton.disabled = loading;
      connection.innerHTML = loading
        ? "<strong>상태</strong> AI 선생님 응답 중"
        : "<strong>상태</strong> 수업 진행 중";
    }

    async function sendMessage(text) {
      addMessage("user", text);
      messages.push({ role: "user", content: text });
      setLoading(true);
      const typing = addMessage("assistant", "AI 선생님이 생각하고 있습니다…", "typing");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ courseId: COURSE_ID, messages })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "수업 연결에 실패했습니다.");

        typing.remove();
        lastAssistantText = data.text;
        addMessage("assistant", data.text);
        messages.push({ role: "assistant", content: data.text });
      } catch (error) {
        typing.remove();
        addMessage("assistant", error.message || "수업 연결 중 문제가 발생했습니다.");
        connection.innerHTML = "<strong>상태</strong> 연결 확인 필요";
      } finally {
        setLoading(false);
        input.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendMessage(text);
    });

    document.getElementById("restart").addEventListener("click", () => {
      messages.length = 0;
      chat.replaceChildren();
      addMessage("assistant", "새 수업을 준비했습니다. “시작”이라고 입력해 주세요.");
      connection.innerHTML = "<strong>상태</strong> 수업 준비";
      input.focus();
    });

    document.getElementById("speak").addEventListener("click", () => {
      if (!("speechSynthesis" in window)) {
        addMessage("assistant", "이 브라우저에서는 음성 읽기를 지원하지 않습니다.");
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(lastAssistantText);
      utterance.lang = "ko-KR";
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEM AI CLASS 학생 입장</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f3f6fb;
      color: #172033;
      text-align: center;
    }

    header {
      padding: 48px 20px;
      color: white;
      background: linear-gradient(135deg, #07162d, #173d70);
    }

    .brand {
      margin-bottom: 15px;
      color: #f1cf7a;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      margin: 18px 0 0;
      font-size: 18px;
      line-height: 1.6;
    }

    main {
      width: 92%;
      max-width: 520px;
      margin: 45px auto;
    }

    .login-box {
      padding: 40px 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, .12);
    }

    .login-box h2 {
      margin: 0 0 12px;
      color: #173d70;
      font-size: 28px;
    }

    .login-box p {
      margin: 0 0 28px;
      color: #596579;
      line-height: 1.6;
    }

    .language-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 0 0 28px;
    }

    .language-option {
      min-height: 104px;
      margin: 0;
      padding: 14px 10px;
      border: 2px solid #d4deec;
      border-radius: 14px;
      background: #f8fbff;
      color: #173d70;
      font-size: 14px;
      line-height: 1.35;
    }

    .language-option strong {
      display: block;
      margin: 5px 0 3px;
      font-size: 16px;
    }

    .language-option[aria-pressed="true"] {
      border-color: #1e67c6;
      background: #eaf3ff;
      box-shadow: 0 0 0 3px rgba(30, 103, 198, .12);
    }

    .school-level-section {
      display: none;
      margin: -4px 0 28px;
      padding: 18px;
      border: 1px solid #d7e2f0;
      border-radius: 14px;
      background: #f7faff;
    }

    .school-level-section.is-visible {
      display: block;
    }

    .school-level-title {
      display: block;
      margin-bottom: 12px;
      color: #173d70;
      font-size: 15px;
      font-weight: bold;
      text-align: left;
    }

    .school-level-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .school-level-option {
      width: 100%;
      margin: 0;
      padding: 13px 9px;
      border: 2px solid #d4deec;
      border-radius: 11px;
      background: white;
      color: #173d70;
      font-size: 14px;
      line-height: 1.35;
    }

    .school-level-option strong {
      display: block;
      font-size: 15px;
    }

    .school-level-option[aria-pressed="true"] {
      border-color: #1e67c6;
      background: #eaf3ff;
      box-shadow: 0 0 0 3px rgba(30, 103, 198, .1);
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #173d70;
      font-size: 16px;
      font-weight: bold;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 2px solid #cad5e5;
      border-radius: 12px;
      font-size: 18px;
      text-transform: uppercase;
      outline: none;
    }

    input:focus {
      border-color: #1e67c6;
      box-shadow: 0 0 0 3px rgba(30, 103, 198, .12);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 17px;
      border: 0;
      border-radius: 12px;
      background: #1e67c6;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #144f9d;
    }

    button:disabled {
      cursor: wait;
      opacity: .7;
    }

    .login-error {
      min-height: 24px;
      margin-top: 14px;
      color: #b42318;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.55;
    }

    .notice {
      margin-top: 24px;
      padding: 17px;
      border-radius: 12px;
      background: #fff8df;
      color: #594a22;
      font-size: 14px;
      line-height: 1.7;
    }

    footer {
      padding: 25px 15px 40px;
      color: #6c7685;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header {
        padding: 38px 18px;
      }

      header h1 {
        font-size: 29px;
      }

      .login-box {
        padding: 32px 22px;
      }

      .language-grid {
        grid-template-columns: 1fr;
      }

      .language-option {
        min-height: 0;
      }

      .school-level-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">GEM AI LEARNING MISSION CLASS</div>
    <h1>초·중·고 개인 맞춤형 AI 학습</h1>
    <p>
      학생의 현재 수준에 맞는 과목과 레벨을 선택하여<br>
      AI 학습을 시작합니다.
    </p>
  </header>

  <main>
    <section class="login-box">
      <h2 id="entrance-title">교육과정 선택</h2>
      <p>
        먼저 공부할 언어와 교육과정을 선택한 뒤<br>
        등록된 학생 ID로 입장합니다.
      </p>

      <div class="language-grid" role="group" aria-label="언어와 교육과정 선택">
        <button class="language-option" type="button" data-language="ko" aria-pressed="true">
          <span aria-hidden="true">🇰🇷</span>
          <strong>한국 교육과정</strong>
          Korean Program
        </button>
        <button class="language-option" type="button" data-language="en" aria-pressed="false">
          <span aria-hidden="true">🇺🇸</span>
          <strong>English Program</strong>
          Elementary, Middle &amp; High School
        </button>
        <button class="language-option" type="button" data-language="fr" aria-pressed="false">
          <span aria-hidden="true">🇫🇷</span>
          <strong>Programme français</strong>
          École primaire, Collège &amp; Lycée
        </button>
      </div>

      <div id="school-level-section" class="school-level-section" aria-live="polite">
        <span id="school-level-title" class="school-level-title">학교급 선택</span>
        <div class="school-level-grid" role="group" aria-labelledby="school-level-title">
          <button class="school-level-option" type="button" data-level="elementary" aria-pressed="true">
            <strong id="elementary-label">Elementary</strong>
            <span id="elementary-grades">Grades 1–5</span>
          </button>
          <button class="school-level-option" type="button" data-level="middle" aria-pressed="false">
            <strong id="middle-label">Middle School</strong>
            <span id="middle-grades">Grades 6–8</span>
          </button>
          <button class="school-level-option" type="button" data-level="high" aria-pressed="false">
            <strong id="high-label">High School</strong>
            <span id="high-grades">Grades 9–12</span>
          </button>
        </div>
      </div>

      <form id="student-login">
        <label for="studentId">학생 ID</label>

        <input
          id="studentId"
          name="id"
          type="text"
          placeholder="예: R260001"
          autocomplete="off"
          required
        >

        <button id="login-button" type="submit">
          💎 GEM AI CLASS 입장
        </button>
        <div id="login-error" class="login-error" role="alert" aria-live="polite"></div>
      </form>

      <div class="notice">
        학생 ID는 담당 선생님에게 확인해 주세요.<br>
        입장 시간은 수업 관리표에 자동으로 기록됩니다.
      </div>
    </section>
  </main>

  <footer>
    © GEM AI Learning Mission Class<br>
    AI가 가르치고, 사람 담임 선생님이 책임집니다.
  </footer>
  <script>
    const loginForm = document.getElementById("student-login");
    const studentIdInput = document.getElementById("studentId");
    const loginButton = document.getElementById("login-button");
    const loginError = document.getElementById("login-error");
    const languageOptions = [...document.querySelectorAll(".language-option")];
    const schoolLevelSection = document.getElementById("school-level-section");
    const schoolLevelTitle = document.getElementById("school-level-title");
    const schoolLevelOptions = [...document.querySelectorAll(".school-level-option")];
    const elementaryLabel = document.getElementById("elementary-label");
    const elementaryGrades = document.getElementById("elementary-grades");
    const middleLabel = document.getElementById("middle-label");
    const middleGrades = document.getElementById("middle-grades");
    const highLabel = document.getElementById("high-label");
    const highGrades = document.getElementById("high-grades");
    const languageRoutes = {
      ko: "/class.html",
      en: {
        elementary: "https://gem-english-elementary-math.seoul0119.chatgpt.site",
        middle: "https://gem-english-middle-school-math.seoul0119.chatgpt.site",
        high: "https://gem-english-high-school-math.seoul0119.chatgpt.site"
      },
      fr: {
        elementary: "https://gem-french-ce2-math.seoul0119.chatgpt.site",
        middle: "https://gem-french-middle-school-math.seoul0119.chatgpt.site",
        high: "https://gem-french-high-school-math.seoul0119.chatgpt.site"
      }
    };
    let selectedLanguage = "ko";
    let selectedSchoolLevel = "elementary";
    localStorage.setItem("gem-program-language", selectedLanguage);

    function selectLanguage(language) {
      selectedLanguage = language;
      localStorage.setItem("gem-program-language", language);
      languageOptions.forEach((option) => {
        option.setAttribute("aria-pressed", String(option.dataset.language === language));
      });
      const hasSchoolLevels = language === "en" || language === "fr";
      schoolLevelSection.classList.toggle("is-visible", hasSchoolLevels);
      if (language === "fr") {
        schoolLevelTitle.textContent = "Choisir le niveau scolaire";
        elementaryLabel.textContent = "École primaire";
        elementaryGrades.textContent = "CP–CM2";
        middleLabel.textContent = "Collège";
        middleGrades.textContent = "6e–3e";
        highLabel.textContent = "Lycée";
        highGrades.textContent = "Seconde–Terminale";
      } else {
        schoolLevelTitle.textContent = "Choose school level";
        elementaryLabel.textContent = "Elementary";
        elementaryGrades.textContent = "Grades 1–5";
        middleLabel.textContent = "Middle School";
        middleGrades.textContent = "Grades 6–8";
        highLabel.textContent = "High School";
        highGrades.textContent = "Grades 9–12";
      }
      const labels = {
        ko: "💎 GEM AI CLASS 입장",
        en: "💎 Enter English Program",
        fr: "💎 Entrer dans le programme français"
      };
      loginButton.textContent = labels[language];
    }

    function selectSchoolLevel(level) {
      selectedSchoolLevel = level;
      localStorage.setItem("gem-school-level", level);
      schoolLevelOptions.forEach((option) => {
        option.setAttribute("aria-pressed", String(option.dataset.level === level));
      });
    }

    languageOptions.forEach((option) => {
      if (!option.disabled) {
        option.addEventListener("click", () => selectLanguage(option.dataset.language));
      }
    });
    schoolLevelOptions.forEach((option) => {
      option.addEventListener("click", () => selectSchoolLevel(option.dataset.level));
    });
    selectSchoolLevel(selectedSchoolLevel);
    selectLanguage(selectedLanguage);

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const studentId = studentIdInput.value.trim().toUpperCase();
      loginError.textContent = "";
      loginButton.disabled = true;
      loginButton.textContent = "등록 확인 및 입장 기록 중…";

      try {
        const response = await fetch("/api/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "login", studentId })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "학생 ID를 확인하지 못했습니다.");
        const selectedRoute = selectedLanguage === "ko"
          ? languageRoutes.ko
          : languageRoutes[selectedLanguage]?.[selectedSchoolLevel];
        location.replace(selectedRoute || data.redirect || "/class.html");
      } catch (error) {
        loginError.textContent = error.message || "입장 연결 중 문제가 발생했습니다.";
        loginButton.disabled = false;
        selectLanguage(selectedLanguage);
        studentIdInput.focus();
      }
    });
  </script>
</body>
</html>

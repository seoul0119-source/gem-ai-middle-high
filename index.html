<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEM AI CLASS 학생 입장</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f3f6fb;
      color: #172033;
      text-align: center;
    }

    header {
      padding: 48px 20px;
      color: white;
      background: linear-gradient(135deg, #07162d, #173d70);
    }

    .brand {
      margin-bottom: 15px;
      color: #f1cf7a;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      margin: 18px 0 0;
      font-size: 18px;
      line-height: 1.6;
    }

    main {
      width: 92%;
      max-width: 520px;
      margin: 45px auto;
    }

    .login-box {
      padding: 40px 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, .12);
    }

    .login-box h2 {
      margin: 0 0 12px;
      color: #173d70;
      font-size: 28px;
    }

    .login-box p {
      margin: 0 0 28px;
      color: #596579;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #173d70;
      font-size: 16px;
      font-weight: bold;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 2px solid #cad5e5;
      border-radius: 12px;
      font-size: 18px;
      text-transform: uppercase;
      outline: none;
    }

    input:focus {
      border-color: #1e67c6;
      box-shadow: 0 0 0 3px rgba(30, 103, 198, .12);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 17px;
      border: 0;
      border-radius: 12px;
      background: #1e67c6;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #144f9d;
    }

    .notice {
      margin-top: 24px;
      padding: 17px;
      border-radius: 12px;
      background: #fff8df;
      color: #594a22;
      font-size: 14px;
      line-height: 1.7;
    }

    footer {
      padding: 25px 15px 40px;
      color: #6c7685;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header {
        padding: 38px 18px;
      }

      header h1 {
        font-size: 29px;
      }

      .login-box {
        padding: 32px 22px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">GEM AI LEARNING MISSION CLASS</div>
    <h1>초·중·고 개인 맞춤형 AI 학습</h1>
    <p>
      학생의 현재 수준에 맞는 과목과 레벨을 선택하여<br>
      AI 학습을 시작합니다.
    </p>
  </header>

  <main>
    <section class="login-box">
      <h2>학생 ID 입력</h2>
      <p>
        등록된 학생 ID를 입력하면<br>
        학습 페이지로 이동합니다.
      </p>

      <form
        action="https://script.google.com/macros/s/AKfycbz6LIvJEhy9KXQbpTghGRaAXtjL03HltJF7Lb4leU6v_q0bkoBsjMkhN-Q8laeT27zDdQ/exec"
        method="get"
      >
        <input type="hidden" name="action" value="login">

        <label for="studentId">학생 ID</label>

        <input
          id="studentId"
          name="id"
          type="text"
          placeholder="예: R260001"
          autocomplete="off"
          required
        >

        <button type="submit">
          💎 GEM AI CLASS 입장
        </button>
      </form>

      <div class="notice">
        학생 ID는 담당 선생님에게 확인해 주세요.<br>
        입장 시간은 수업 관리표에 자동으로 기록됩니다.
      </div>
    </section>
  </main>

  <footer>
    © GEM AI Learning Mission Class<br>
    AI가 가르치고, 사람 담임 선생님이 책임집니다.
  </footer>
</body>
</html>

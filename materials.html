<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEM 수업 자료실</title><style>body{font:18px/1.7 system-ui;color:#17304e;background:#f5f8fc;max-width:620px;margin:12vh auto;padding:24px}button,a{font:inherit;color:#155bc4}</style></head><body><h1>수업 자료실</h1><p id="status">내 자료실을 연결하고 있습니다…</p><button onclick="enter()">다시 연결</button> <a href="/">처음 화면</a><script>
async function enter(){try{const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'classroom-pass',classroom:'en'})});const d=await r.json();if(r.status===401){location.replace('/?materials=1&'+new URLSearchParams(location.search).toString());return;}if(!r.ok||!d.ticket)throw Error('연결이 지연되고 있습니다. 다시 연결을 눌러 주세요.');const f=document.createElement('form');f.method='POST';f.action='https://gem-english-middle-school-math.seoul0119.chatgpt.site/api/learning/entry';for(const [name,value]of Object.entries({ticket:d.ticket,destination:'/materials'+location.search})){const i=document.createElement('input');i.type='hidden';i.name=name;i.value=value;f.append(i);}document.body.append(f);f.submit();}catch(e){document.getElementById('status').textContent=e.message;}}enter();
</script></body></html>

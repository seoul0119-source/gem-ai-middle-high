<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GEM · Common programme · PC 5 languages</title><link rel="stylesheet" href="./pc/style.css"></head><body>
<div class="operator-note" lang="ko">GEM PC 공통 과정 · 5개 언어 1차 시험 · 초2 덧셈 연결 · 신규 번역/기기 음성 검토 필요</div>
<main id="shell"><header><a class="brand" href="#">GEM <span>GLOBAL MISSION</span></a><nav id="languages" aria-label="Teaching language" dir="ltr"></nav><button id="fullscreen" type="button" data-t="full">Full screen</button></header>
<section id="catalog"><div class="intro"><p class="eyebrow" data-t="common"></p><h1 data-t="programme"></h1><p data-t="pcNotice"></p></div><div class="selector"><label><span data-t="grade"></span><select id="grade"></select></label><label><span data-t="subject"></span><select id="subject"></select></label><button id="open-course" type="button" class="primary" data-t="open"></button></div><p id="course-status" role="status"></p><div class="course-grid" id="course-grid"></div><p class="muted" data-t="optional"></p><a href="./index.html" data-t="sample"></a></section>
<section id="lesson" hidden><div class="lesson-bar"><button id="catalog-back" data-t="return"></button><strong id="step-label"></strong><span id="timer" dir="ltr">00:00 / 40:00</span><button id="new-lesson" data-t="newLesson"></button></div>
<div class="classroom"><section id="stage" class="stage"><canvas id="avatar"></canvas><div id="load-panel"><button id="load-avatar" class="primary" type="button">GEM 3D</button><p id="model-status" role="status"></p></div><div class="caption"><p id="caption"></p></div></section><aside class="board"><p class="eyebrow" id="material-label"></p><h2 id="lesson-title" data-t="title"></h2><div id="equation" dir="ltr"></div><div id="visual" dir="ltr"></div><p id="prompt"></p><p id="fact"></p><p id="feedback" hidden role="status" dir="auto"></p><p id="review-hold" hidden data-t="review"></p></aside></div>
<section class="interaction"><form id="answer-form"><input id="answer" maxlength="450" autocomplete="off" dir="auto"><button class="primary" data-t="send"></button><button id="mic" type="button" data-t="mic"></button></form><p id="status" role="status"></p></section>
<footer><button id="play" class="primary" data-t="start"></button><button id="repeat" data-t="repeat"></button><button id="next" data-t="next"></button><button id="audio-open" data-t="settings"></button></footer></section>
<p class="review-note" data-t="reviewNotice"></p>
<dialog id="audio"><h2 data-t="settings"></h2><select id="voices"></select><label class="check"><input id="remote" type="checkbox"><span data-t="remote"></span></label><p data-t="voiceNote"></p><label><span data-t="volume"></span><input id="volume" type="range" min="0" max="100" value="65"></label><p id="voice-status" role="status"></p><button id="test-voice" data-t="testVoice"></button><button id="audio-close" data-t="close"></button></dialog>
</main><script type="module" src="./pc/app.mjs"></script></body></html>

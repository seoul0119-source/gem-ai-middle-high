<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GEM · Common classroom programme</title><link rel="stylesheet" href="./pc/style.css"><link rel="stylesheet" href="./programme/style.css"></head><body>
<main id="shell"><header><a class="brand" href="./pc.html">GEM <span>GLOBAL MISSION</span></a><nav id="languages" aria-label="Teaching language" dir="ltr"></nav><button id="fullscreen" data-label="full"></button></header>
<section id="catalog"><div class="intro"><p class="eyebrow" data-label="common"></p><h1 data-label="units"></h1><p id="scope" data-label="draftNotice"></p></div><div class="selector"><label><span data-label="grade"></span><select id="grade"></select></label><label><span data-label="subject"></span><select id="subject"></select></label><label><span data-label="minutes"></span><input id="minutes" type="number" min="10" max="90" step="5" value="40"></label></div><div id="unit-list" class="course-grid"></div><p id="generation-status" role="status" aria-live="polite"></p><button id="cancel-generation" hidden data-label="cancel"></button><div id="preview" hidden><h2 data-label="review"></h2><p data-label="draftNotice"></p><div id="preview-steps"></div><button id="approve" class="primary" data-label="approve"></button><button id="resume" hidden data-label="resume"></button><button id="regenerate" data-label="newLesson"></button></div><p class="muted" data-label="optionalNotice"></p><a id="pilot" href="./pc.html?sample=1" data-label="sample"></a></section>
<section id="lesson" hidden><div class="lesson-bar"><button id="catalog-back" data-label="back"></button><strong id="step-label"></strong><span id="timer" dir="ltr"></span><button id="end-lesson" data-label="end"></button></div><div class="classroom"><section id="stage" class="stage"><canvas id="avatar"></canvas><div id="load-panel"><button id="load-avatar" class="primary">GEM 3D</button><p id="model-status" role="status"></p></div><div class="caption"><p id="caption"></p></div></section><aside class="board"><p id="kind" class="eyebrow"></p><h2 id="lesson-title"></h2><div id="board-content"></div><p id="prompt"></p><div id="options"></div><p id="feedback" role="status" hidden></p><p id="review-hold" hidden data-label="continueHold"></p></aside></div><section class="interaction"><form id="answer-form"><input id="answer" maxlength="450" autocomplete="off" dir="auto"><button class="primary" data-label="send"></button><button id="mic" type="button" data-label="mic"></button></form><p id="status" role="status"></p></section><footer><button id="play" class="primary"></button><button id="repeat" data-label="repeat"></button><button id="previous" data-label="previous"></button><button id="next" data-label="next"></button><button id="audio-open" data-label="settings"></button></footer></section><p id="save-status" role="status"></p>
<dialog id="audio"><h2 data-label="settings"></h2><select id="voices" aria-label="Voice"></select><label class="check"><input id="remote" type="checkbox"><span data-label="remote"></span></label><p data-label="voiceNote"></p><label><span data-label="volume"></span><input id="volume" type="range" min="0" max="100" value="65"></label><p id="voice-status" role="status"></p><button id="test-voice" data-label="testVoice"></button><button id="audio-close" data-label="close"></button></dialog>
</main><script type="module" src="./programme/app.mjs"></script></body></html>
